<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<title>harufocus</title>
<meta name="description" content="시간을 하늘 색으로 보여주는 세로 타임라인 플래너.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='52' r='30' fill='none' stroke='%23f2c14e' stroke-width='7'/><circle cx='50' cy='18' r='6.5' fill='%23f2c14e'/></svg>">
<style>
  :root{
    --ink:#1b2436; --ink-soft:#5a6478; --line:#e6ebf3; --card:#fff; --card-2:#f6f8fc;
    --accent:#f2c14e; --sky-blue:#5b93e6; --rose:#e2748a; --teal:#4bb6bd; --violet:#8f7bd6; --leaf:#6bbf7a; --amber:#e8955a;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{ font-family:var(--sans); color:var(--ink); -webkit-font-smoothing:antialiased;
    background:#0d1526; display:flex; align-items:center; justify-content:center;
    /* ambient blurred sky behind the phone on desktop */
    background-image:radial-gradient(900px 600px at 30% 0%, #35507f, transparent),
                     radial-gradient(900px 700px at 80% 100%, #23324f, transparent),
                     linear-gradient(160deg,#1a2740,#0d1526); }

  /* ---------- the phone ---------- */
  .phone{ position:relative; width:100%; max-width:430px; height:100vh; height:100dvh; max-height:920px;
    background:#0e1830; overflow:hidden; display:flex; flex-direction:column;
    box-shadow:0 40px 90px rgba(0,0,0,.5); border-radius:0 }
  @media(min-width:480px){ .phone{ border-radius:34px; height:min(92vh,900px) } }

  /* sky behind everything (like the app's FullSkyBackground) */
  .sky{ position:absolute; inset:0; z-index:0; overflow:hidden; transition:background .8s ease;
    background:linear-gradient(180deg,#2b3d6b 0%,#5b7bb0 52%,#a9c3e0 82%,#c6d8ea 100%) }
  .sun{ position:absolute; right:22%; top:12%; width:52px;height:52px;border-radius:50%;
    background:radial-gradient(circle at 40% 35%,#fff6d8,#f2c14e); box-shadow:0 0 48px 14px rgba(242,193,78,.5) }
  .cloud{ position:absolute; height:16px; border-radius:20px; background:rgba(255,255,255,.5); filter:blur(.4px) }
  .cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
  .cloud::before{width:26px;height:26px;top:-10px;left:14px}
  .cloud::after{width:20px;height:20px;top:-6px;left:38px}
  .land{ position:absolute; left:0; right:0; bottom:0; height:190px; overflow:hidden; z-index:1 }
  .land .hills{ position:absolute; bottom:0; left:0; width:100%; height:100%;
    object-fit:cover; object-position:center bottom; mix-blend-mode:soft-light; opacity:.9 }
  .land .grass{ position:absolute; left:0; right:0; bottom:0; height:74px;
    background:linear-gradient(180deg, transparent, rgba(30,44,60,.55)55%, rgba(22,32,46,.8)) }
  .tree{ position:absolute; right:20px; bottom:6px; width:96px; z-index:2;
    filter:drop-shadow(0 5px 7px rgba(0,0,0,.35)) }

  /* ---------- app bar ---------- */
  .appbar{ position:relative; z-index:3; display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px 8px; color:#fff }
  .appbar .title{ display:flex; align-items:center; gap:8px; font-weight:800; font-size:18px; letter-spacing:-.02em;
    text-shadow:0 1px 3px rgba(0,0,0,.3) }
  .appbar .title svg{ width:22px; height:22px }
  .acct{ font-family:inherit; font-size:12px; font-weight:600; cursor:pointer; color:#fff;
    background:rgba(255,255,255,.18); border:none; padding:7px 12px; border-radius:999px; backdrop-filter:blur(6px);
    max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .acct.signed::before{ content:"●"; color:#7ee0a0; font-size:8px; margin-right:5px; vertical-align:1px }

  /* ---------- screen (holds the views) ---------- */
  .screen{ position:relative; z-index:2; flex:1; min-height:0 }
  .view{ position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; display:none; -webkit-overflow-scrolling:touch }
  .view.active{ display:block }
  .view.sheet{ background:rgba(247,249,252,.96); backdrop-filter:blur(8px); padding:18px 16px 24px }
  .view.sheet h2{ font-size:20px; letter-spacing:-.02em }
  .view.sheet .sub{ color:var(--ink-soft); font-size:13px; margin:3px 0 16px }

  /* timeline view (transparent over the sky) */
  #view-timeline{ color:#fff }
  .tl-head{ position:absolute; top:6px; left:16px; z-index:2; text-shadow:0 1px 3px rgba(0,0,0,.35) }
  .tl-head .date{ font-weight:700; font-size:14px }
  .tl-head .motto{ font-size:11.5px; opacity:.82 }
  .tl-scroll{ position:relative; padding:52px 0 200px; min-height:100% }
  .hour{ position:relative; height:76px; padding-left:52px }
  .hour .lbl{ position:absolute; left:14px; top:-8px; font-size:12px; font-variant-numeric:tabular-nums; opacity:.75;
    color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.3) }
  .hour .rule{ position:absolute; left:46px; right:14px; top:0; height:1px; background:rgba(255,255,255,.2) }
  .now{ position:absolute; left:8px; right:12px; z-index:4; display:flex; align-items:center; gap:8px }
  .now .pill{ background:var(--accent); color:#3a2c05; font-weight:800; font-size:11px; padding:3px 8px; border-radius:8px }
  .now .wire{ flex:1; height:2px; background:var(--accent); border-radius:2px; opacity:.9 }
  .block{ position:absolute; left:52px; right:14px; border-radius:13px; padding:9px 12px; z-index:3;
    color:#22303f; font-weight:600; font-size:13.5px; box-shadow:0 6px 16px rgba(20,30,60,.2);
    display:flex; align-items:center; gap:8px; border:1px solid rgba(255,255,255,.55) }
  .block .ic{ flex:0 0 auto }
  .block small{ margin-left:auto; font-weight:600; opacity:.55; font-size:11px }

  /* to-do */
  .todo{ display:flex; flex-direction:column; gap:9px }
  .task{ display:flex; align-items:center; gap:11px; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:12px 14px; box-shadow:0 1px 4px rgba(27,36,54,.04) }
  .check{ width:22px;height:22px;border-radius:50%;border:2px solid var(--ink-soft); flex:0 0 auto; cursor:pointer;
    display:grid; place-items:center; transition:.15s }
  .check.done{ background:var(--leaf); border-color:var(--leaf) }
  .check.done::after{ content:"✓"; color:#fff; font-size:13px; font-weight:800 }
  .task .t-title{ font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .task.is-done .t-title{ text-decoration:line-through; color:var(--ink-soft) }
  .task .swatch{ width:10px;height:10px;border-radius:3px; flex:0 0 auto }
  .task .star{ cursor:pointer; color:#d3d9e4; font-size:17px }
  .task .star.on{ color:var(--accent) }
  .task .time{ font-size:12px; color:var(--ink-soft); font-variant-numeric:tabular-nums }

  /* matrix */
  .matrix{ display:grid; grid-template-columns:1fr 1fr; gap:10px }
  .quad{ border-radius:15px; padding:12px; min-height:132px; border:1px solid var(--line) }
  .quad h3{ font-size:12.5px; font-weight:700; margin-bottom:9px }
  .quad .mtask{ background:rgba(255,255,255,.8); border-radius:9px; padding:7px 9px; font-size:12.5px; margin-bottom:6px; box-shadow:0 1px 3px rgba(0,0,0,.05) }
  .q1{background:#fce9ec}.q2{background:#e5f6ea}.q3{background:#fdf1dd}.q4{background:#eef1f6}
  .q1 h3{color:#c0455f}.q2 h3{color:#3f9a58}.q3 h3{color:#c58a1e}.q4 h3{color:#6b7688}

  /* routine */
  .routines{ display:flex; flex-direction:column; gap:11px }
  .routine{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:13px 15px }
  .routine .r-top{ display:flex; align-items:center; gap:10px }
  .routine .r-emoji{ font-size:19px }
  .routine .r-name{ font-weight:700 }
  .routine .r-meta{ margin-left:auto; font-size:12px; color:var(--ink-soft) }
  .routine .play{ width:32px;height:32px;border-radius:50%; background:var(--ink); color:#fff; display:grid; place-items:center; margin-left:6px; font-size:12px; cursor:pointer }
  .days{ display:flex; gap:5px; margin-top:11px }
  .day{ width:28px;height:28px;border-radius:8px; display:grid; place-items:center; font-size:12px; font-weight:700;
    background:var(--card-2); color:var(--ink-soft); border:1px solid var(--line) }
  .day.on{ background:var(--teal); color:#fff; border-color:var(--teal) }

  /* bucket (3D hexagon, Bidoro식) */
  .bucket-wrap{ display:flex; flex-direction:column; align-items:center; gap:18px }
  .scene3d{ width:230px; height:230px; perspective:640px; flex:0 0 auto }
  .tub{ position:absolute; left:50%; top:50%; width:0; height:0; transform-style:preserve-3d; transform:translate(-50%,-50%) rotateX(34deg) }
  .tub > *{ position:absolute; left:0; top:0 }
  .wall{ border:1px solid rgba(255,255,255,.5); box-shadow:inset 0 -28px 48px rgba(0,0,0,.10), inset 0 10px 22px rgba(255,255,255,.18) }
  .wlabel{ position:absolute; inset:0; display:flex; align-items:flex-start; justify-content:center; padding-top:18px;
    font-weight:800; font-size:13px; color:#474d59; text-shadow:0 1px 1px rgba(255,255,255,.5) }
  .badge3d{ position:absolute; left:0; top:0; white-space:nowrap; background:#3b414e; color:#fff; font-weight:800; font-size:15px;
    padding:5px 12px; border-radius:999px; box-shadow:0 8px 18px rgba(0,0,0,.32) }
  .sides{ width:100%; max-width:300px; display:flex; flex-direction:column; gap:9px }
  .side{ display:flex; align-items:center; gap:10px; font-size:13px }
  .side .s-name{ width:52px; font-weight:600 }
  .side .bar{ flex:1; height:10px; border-radius:6px; background:var(--line); overflow:hidden }
  .side .fill{ height:100%; border-radius:6px }
  .side .s-val{ width:32px; text-align:right; color:var(--ink-soft); font-variant-numeric:tabular-nums }

  .empty{ color:var(--ink-soft); font-size:14px; text-align:center; padding:30px 10px }

  /* ---------- tab bar ---------- */
  .tabbar{ position:relative; z-index:3; display:flex; background:rgba(255,255,255,.9); backdrop-filter:blur(14px);
    border-top:1px solid rgba(0,0,0,.06); padding:6px 4px calc(6px + env(safe-area-inset-bottom)) }
  .tabbtn{ flex:1; border:none; background:transparent; font-family:inherit; cursor:pointer; padding:6px 2px;
    display:flex; flex-direction:column; align-items:center; gap:3px; color:#9aa3b2; font-size:10.5px; font-weight:600 }
  .tabbtn svg{ width:23px; height:23px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round }
  .tabbtn.active{ color:var(--ink) }
  .tabbtn.active svg{ stroke:var(--sky-blue) }

  /* ---------- login modal ---------- */
  .scrim{ position:absolute; inset:0; z-index:20; background:rgba(15,20,40,.5); backdrop-filter:blur(4px);
    display:none; align-items:center; justify-content:center; padding:22px }
  .scrim.open{ display:flex }
  .modal{ position:relative; background:var(--card); border-radius:22px; padding:26px 22px 20px; width:100%; max-width:360px;
    box-shadow:0 30px 70px rgba(0,0,0,.4); animation:pop .25s ease }
  @keyframes pop{ from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none} }
  .modal h3{ font-size:20px; letter-spacing:-.02em }
  .modal .msub{ color:var(--ink-soft); font-size:12.5px; margin:6px 0 16px }
  .modal input{ width:100%; font-family:inherit; font-size:15px; padding:12px 13px; margin-bottom:9px;
    border:1px solid var(--line); border-radius:12px; background:var(--card-2); outline:none }
  .modal input:focus{ border-color:var(--sky-blue) }
  .modal .go{ width:100%; justify-content:center; margin-top:5px; border:none; cursor:pointer; font-family:inherit;
    font-size:15px; font-weight:700; padding:13px; border-radius:13px; background:var(--ink); color:#fff }
  .modal .merr{ color:#d5495f; font-size:12.5px; min-height:16px; margin:2px 0 3px }
  .modal .mswitch{ text-align:center; font-size:12.5px; color:var(--ink-soft); margin-top:13px }
  .modal .mswitch a{ color:var(--sky-blue); font-weight:600; cursor:pointer }
  .modal .mclose{ position:absolute; top:12px; right:14px; border:none; background:transparent; font-size:18px; color:var(--ink-soft); cursor:pointer }
</style>
</head>
<body>

<div class="phone">
  <!-- sky behind everything -->
  <div class="sky" id="sky">
    <div class="sun" id="sun"></div>
    <div class="cloud" style="top:20%; left:14%; width:44px"></div>
    <div class="cloud" style="top:33%; left:58%; width:34px"></div>
    <div class="cloud" style="top:46%; left:24%; width:50px"></div>
    <div class="land">
      <img class="hills" src="assets/hills.png" alt="">
      <div class="grass"></div>
    </div>
    <img class="tree" src="assets/tree.png" alt="">
  </div>

  <!-- app bar -->
  <div class="appbar">
    <div class="title">
      <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="54" r="28" fill="none" stroke="#f2c14e" stroke-width="7"/><circle cx="50" cy="20" r="6.5" fill="#f2c14e"/></svg>
      harufocus
    </div>
    <button class="acct" id="accountBtn">로그인</button>
  </div>

  <!-- screen -->
  <div class="screen">
    <section class="view active" id="view-timeline">
      <div class="tl-head"><div class="date" id="tlDate">오늘</div><div class="motto" id="motto">한 걸음씩, 하늘처럼.</div></div>
      <div class="tl-scroll" id="tlScroll"><!-- hours+blocks injected --></div>
    </section>

    <section class="view sheet" id="view-todo">
      <h2>할 일</h2><div class="sub">별표로 위로 올리고, 체크로 완료해요.</div>
      <div class="todo" id="todoList"></div>
    </section>

    <section class="view sheet" id="view-matrix">
      <h2>매트릭스</h2><div class="sub">중요도와 급함으로 네 칸에 나눠 담아요.</div>
      <div class="matrix" id="matrixGrid"></div>
    </section>

    <section class="view sheet" id="view-routine">
      <h2>루틴</h2><div class="sub">요일마다 반복되는 일을 한 번에 시작해요.</div>
      <div class="routines" id="routineList"></div>
    </section>

    <section class="view sheet" id="view-bucket">
      <h2>오늘의 물통</h2><div class="sub">집중한 시간이 비가 되어 채워요. 하루 목표 4시간.</div>
      <div class="bucket-wrap"><div class="scene3d"><div class="tub" id="tub"></div></div>
        <div class="sides" id="bucketSides"></div></div>
    </section>
  </div>

  <!-- tab bar -->
  <nav class="tabbar">
    <button class="tabbtn active" data-view="timeline"><svg viewBox="0 0 24 24"><path d="M3 18h18M7 18a5 5 0 0 1 10 0M12 4v3M5 8l2 2M19 8l-2 2"/></svg>타임라인</button>
    <button class="tabbtn" data-view="todo"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>할일</button>
    <button class="tabbtn" data-view="matrix"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>매트릭스</button>
    <button class="tabbtn" data-view="routine"><svg viewBox="0 0 24 24"><path d="M4 7h11a4 4 0 0 1 4 4M20 17H9a4 4 0 0 1-4-4M16 4l3 3-3 3M8 20l-3-3 3-3"/></svg>루틴</button>
    <button class="tabbtn" data-view="bucket"><svg viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>물통</button>
  </nav>

  <!-- login modal -->
  <div class="scrim" id="loginScrim">
    <div class="modal">
      <button class="mclose" id="loginClose" aria-label="닫기">✕</button>
      <h3 id="loginTitle">로그인</h3>
      <div class="msub">harufocus 계정으로 로그인하면 아이폰·아이패드와 같은 데이터를 봐요.</div>
      <input id="loginEmail" type="email" autocomplete="email" placeholder="이메일">
      <input id="loginPw" type="password" autocomplete="current-password" placeholder="비밀번호 (6자 이상)">
      <div class="merr" id="loginErr"></div>
      <button class="go" id="loginGo">로그인</button>
      <div class="mswitch" id="loginSwitch">계정이 없나요? <a id="loginToggle">회원가입</a></div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var SUPA_URL='https://sbatsnivlrlywpfytlio.supabase.co';
  var SUPA_KEY='sb_publishable_vwZUKHhhtBEjAgXrZQTNFQ_bQeM8Ypc';
  var AUTH_KEY='sundialWebAuth';

  /* ---- tab switching ---- */
  var tabs=document.querySelectorAll('.tabbtn'), views=document.querySelectorAll('.view');
  tabs.forEach(function(t){ t.addEventListener('click',function(){
    tabs.forEach(function(x){x.classList.remove('active');}); views.forEach(function(v){v.classList.remove('active');});
    t.classList.add('active'); var v=document.getElementById('view-'+t.dataset.view); if(v) v.classList.add('active');
  }); });

  /* ---- helpers + category map (app Category.swift) ---- */
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function hexA(h,a){ var n=parseInt(h.slice(1),16); return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')'; }
  var CATS={ focus:{name:'공부/일',color:'#4585D6'}, study:{name:'성장',color:'#27AFC1'}, health:{name:'몸',color:'#F0863D'},
    mind:{name:'마음',color:'#E85A8A'}, life:{name:'돈',color:'#43B96B'}, rest:{name:'기쁨',color:'#EAB81E'} };
  function catColor(id){ return (CATS[id]||CATS.focus).color; }
  function catName(id){ return (CATS[id]||CATS.focus).name; }
  function catIcon(id){ return {focus:'📘',study:'🌱',health:'🏃',mind:'🧘',life:'💰',rest:'🎉'}[id]||'•'; }
  function fmtTime(iso){ if(!iso) return '—'; var d=new Date(iso); return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); }

  /* ---- demo data (snapshot shape) ---- */
  function todayAt(h,m){ var d=new Date(); d.setHours(h,m||0,0,0); return d.toISOString(); }
  var DEMO={
    tasks:[
      {title:'보고서 초안',categoryID:'focus',scheduledStart:todayAt(9,0),durationMin:90,isStarred:true,matrixQuadrant:1},
      {title:'영어 공부',categoryID:'study',scheduledStart:todayAt(11,0),durationMin:45,isStarred:true,matrixQuadrant:2},
      {title:'점심 · 산책',categoryID:'health',scheduledStart:todayAt(13,0),durationMin:60,matrixQuadrant:0},
      {title:'집중 작업',categoryID:'focus',scheduledStart:todayAt(15,0),durationMin:120,matrixQuadrant:1},
      {title:'스트레칭',categoryID:'health',scheduledStart:todayAt(20,0),durationMin:30,isDone:true,matrixQuadrant:2},
      {title:'장보기',categoryID:'life',scheduledStart:null,durationMin:0,matrixQuadrant:3},
      {title:'회의 일정 조율',categoryID:'focus',scheduledStart:null,durationMin:0,matrixQuadrant:3},
      {title:'명상',categoryID:'mind',scheduledStart:todayAt(22,30),durationMin:10,matrixQuadrant:2}
    ],
    habits:[
      {title:'아침 스트레칭',categoryID:'health',weekdaysMask:62,reminderMinutesJSON:'[420]'},
      {title:'영어 단어',categoryID:'study',weekdaysMask:42,reminderMinutesJSON:'[1260]'},
      {title:'저녁 명상',categoryID:'mind',weekdaysMask:127,reminderMinutesJSON:'[1350]'}
    ],
    sessions:[{categoryID:'focus',focusedSec:3600},{categoryID:'study',focusedSec:1800},
      {categoryID:'health',focusedSec:1500},{categoryID:'mind',focusedSec:1500},{categoryID:'life',focusedSec:600}],
    settings:{focusGoalMinutes:240,motto:'한 걸음씩, 하늘처럼.'}
  };

  /* ---- renderers ---- */
  var TL_START=7, TL_END=24, PPH=76;
  function yFor(hf){ return 52+(hf-TL_START)*PPH; }
  function renderTimeline(data){
    var scroll=document.getElementById('tlScroll'); scroll.innerHTML='';
    var html=''; for(var h=TL_START;h<=TL_END;h++){ var lb=(h%24).toString().padStart(2,'0')+':00';
      html+='<div class="hour"><span class="lbl">'+lb+'</span><span class="rule"></span></div>'; }
    scroll.insertAdjacentHTML('beforeend',html);
    (data.tasks||[]).forEach(function(t){
      if(!t.scheduledStart||!t.durationMin) return;
      var d=new Date(t.scheduledStart); var hf=d.getHours()+d.getMinutes()/60; if(hf<TL_START||hf>TL_END) return;
      var col=catColor(t.categoryID);
      var el=document.createElement('div'); el.className='block';
      el.style.top=yFor(hf)+'px'; el.style.height=Math.max(28,(t.durationMin/60)*PPH-6)+'px';
      el.style.background=hexA(col,0.85); el.style.borderColor=hexA(col,0.5);
      el.style.color='#fff';
      el.innerHTML='<span class="ic">'+catIcon(t.categoryID)+'</span>'+esc(t.title)+'<small style="color:rgba(255,255,255,.75)">'+t.durationMin+'m</small>';
      scroll.appendChild(el);
    });
    var now=new Date(); var nf=now.getHours()+now.getMinutes()/60; if(nf<TL_START) nf=TL_START+2.2;
    var n=document.createElement('div'); n.className='now'; n.style.top=yFor(nf)+'px';
    n.innerHTML='<span class="pill">지금</span><span class="wire"></span>'; scroll.appendChild(n);
    setTimeout(function(){ var v=document.getElementById('view-timeline'); v.scrollTop=Math.max(0,yFor(nf)-150); },40);
  }
  var todoLocal=[];
  function drawTodo(){
    var list=document.getElementById('todoList'); list.innerHTML='';
    if(!todoLocal.length){ list.innerHTML='<div class="empty">할 일이 없어요.</div>'; return; }
    todoLocal.slice().sort(function(a,b){return (b.star?1:0)-(a.star?1:0);}).forEach(function(it){
      var row=document.createElement('div'); row.className='task'+(it.done?' is-done':'');
      row.innerHTML='<span class="check'+(it.done?' done':'')+'"></span><span class="swatch" style="background:'+it.c+'"></span>'+
        '<span class="t-title">'+esc(it.t)+'</span><span class="time">'+it.time+'</span>'+
        '<span class="star'+(it.star?' on':'')+'">'+(it.star?'★':'☆')+'</span>';
      row.querySelector('.check').addEventListener('click',function(){ it.done=!it.done; drawTodo(); });
      row.querySelector('.star').addEventListener('click',function(){ it.star=!it.star; drawTodo(); });
      list.appendChild(row);
    });
  }
  function renderTodo(data){ todoLocal=(data.tasks||[]).map(function(t){ return {t:t.title,c:catColor(t.categoryID),
    time:fmtTime(t.scheduledStart),star:!!t.isStarred,done:!!t.isDone}; }); drawTodo(); }
  function renderMatrix(data){
    var g=document.getElementById('matrixGrid'); g.innerHTML='';
    [{q:1,cls:'q1',h:'🔥 급하고 중요'},{q:2,cls:'q2',h:'🌱 안 급하지만 중요'},{q:3,cls:'q3',h:'⚡ 급하지만 덜 중요'},{q:4,cls:'q4',h:'💤 안 급하고 덜 중요'}].forEach(function(qd){
      var items=(data.tasks||[]).filter(function(t){return t.matrixQuadrant===qd.q;});
      var b=document.createElement('div'); b.className='quad '+qd.cls;
      b.innerHTML='<h3>'+qd.h+'</h3>'+items.map(function(t){return '<div class="mtask">'+esc(t.title)+'</div>';}).join('');
      g.appendChild(b);
    });
  }
  function renderRoutine(data){
    var w=document.getElementById('routineList'); w.innerHTML='';
    var labels=['월','화','수','목','금','토','일'], bits=[1,2,3,4,5,6,0];
    if(!(data.habits||[]).length){ w.innerHTML='<div class="empty">루틴이 없어요.</div>'; return; }
    data.habits.forEach(function(h){
      var mins=[]; try{ mins=JSON.parse(h.reminderMinutesJSON||'[]'); }catch(e){}
      var t=mins.length?(Math.floor(mins[0]/60).toString().padStart(2,'0')+':'+(mins[0]%60).toString().padStart(2,'0')):catName(h.categoryID);
      var days=labels.map(function(lb,i){ return '<span class="day'+(((h.weekdaysMask>>bits[i])&1)?' on':'')+'">'+lb+'</span>'; }).join('');
      var c=document.createElement('div'); c.className='routine';
      c.innerHTML='<div class="r-top"><span class="r-emoji">'+catIcon(h.categoryID)+'</span><span class="r-name">'+esc(h.title)+'</span>'+
        '<span class="r-meta">'+t+'</span><span class="play">▶</span></div><div class="days">'+days+'</div>';
      w.appendChild(c);
    });
  }
  function renderBucket(data){
    var mins={}; (data.sessions||[]).forEach(function(s){ mins[s.categoryID]=(mins[s.categoryID]||0)+Math.round(s.focusedSec/60); });
    var goal=(data.settings&&data.settings.focusGoalMinutes)||240;
    var total=Object.keys(mins).reduce(function(a,k){return a+mins[k];},0);
    buildBucket(Math.max(0,Math.min(1,total/goal)));
    var sides=document.getElementById('bucketSides'); sides.innerHTML='';
    var order=['focus','study','health','mind','life','rest'].filter(function(k){return mins[k];});
    if(!order.length){ sides.innerHTML='<div class="empty">아직 집중 기록이 없어요.</div>'; return; }
    var mx=Math.max(60, order.reduce(function(a,k){return Math.max(a,mins[k]);},0));
    order.forEach(function(k){ var row=document.createElement('div'); row.className='side';
      row.innerHTML='<span class="s-name">'+catName(k)+'</span><div class="bar"><div class="fill" style="width:'+Math.round(mins[k]/mx*100)+'%;background:'+catColor(k)+'"></div></div><span class="s-val">'+mins[k]+'</span>';
      sides.appendChild(row); });
  }
  function buildBucket(fill){
    var tub=document.getElementById('tub'); if(!tub) return; tub.innerHTML='';
    var N=6,R=80,H=146; var a=R*Math.cos(Math.PI/N), s=2*R*Math.sin(Math.PI/N); var fh=H*fill;
    var faces=['rgba(69,133,214,.40)','rgba(107,191,122,.42)','rgba(232,149,90,.40)','rgba(143,123,214,.42)','rgba(75,182,189,.40)','rgba(226,116,138,.42)'];
    var labels={0:catName('focus'),1:catName('health'),5:catName('mind')};
    function box(w,h){ var e=document.createElement('div'); e.style.width=w+'px'; e.style.height=h+'px'; e.style.marginLeft=(-w/2)+'px'; e.style.marginTop=(-h/2)+'px'; return e; }
    var pts=[]; for(var j=0;j<N;j++){ var ang=(30+j*60)*Math.PI/180; pts.push((50+50*Math.cos(ang)).toFixed(1)+'% '+(50+50*Math.sin(ang)).toFixed(1)+'%'); }
    var hex='polygon('+pts.join(',')+')';
    var fl=box(2*R,2*R); fl.className='wall'; fl.style.border='none'; fl.style.boxShadow='none';
    fl.style.background='linear-gradient(160deg,#c9d3e2,#aab8cc)'; fl.style.clipPath=hex; fl.style.transform='translateY('+(H/2)+'px) rotateX(90deg)'; tub.appendChild(fl);
    for(var i=0;i<N;i++){ var ww=box(s,fh); ww.style.background='linear-gradient(180deg,rgba(127,196,232,.85),rgba(74,159,214,.9))';
      ww.style.transform='rotateY('+(i*60)+'deg) translateZ('+(a-2)+'px) translateY('+((H-fh)/2)+'px)'; tub.appendChild(ww); }
    var sf=box(2*R,2*R); sf.style.background='radial-gradient(circle at 42% 38%,#bfe4f5,#7cc0ea 70%)'; sf.style.clipPath=hex;
    sf.style.transform='translateY('+(H/2-fh)+'px) rotateX(90deg)'; tub.appendChild(sf);
    for(var k=0;k<N;k++){ var wall=box(s,H); wall.className='wall'; wall.style.background=faces[k]; wall.style.transform='rotateY('+(k*60)+'deg) translateZ('+a+'px)';
      if(labels[k]){ var lb=document.createElement('div'); lb.className='wlabel'; lb.textContent=labels[k]; wall.appendChild(lb); } tub.appendChild(wall); }
    var bd=document.createElement('div'); bd.className='badge3d'; bd.textContent=Math.round(fill*10)+' / 10';
    bd.style.transform='translate(-50%,-50%) translateY(6px) translateZ('+(a+30)+'px)'; tub.appendChild(bd);
  }

  /* ---- sky by current time (tints sky + hills via soft-light) ---- */
  (function sky(){
    var nf=new Date().getHours()+new Date().getMinutes()/60;
    function pal(hf){ if(hf<6)return['#141b33','#22305b','#3a4d7d']; if(hf<8)return['#3a4d7d','#c98a6b','#e8c48f'];
      if(hf<16)return['#3f6fb0','#77a7dd','#bcd6ef']; if(hf<19)return['#3a4f86','#c9776b','#f0b57e'];
      if(hf<21)return['#26305a','#5a5f92','#9a86b6']; return['#141b33','#22305b','#3a4d7d']; }
    var p=pal(nf);
    document.getElementById('sky').style.background='linear-gradient(180deg,'+p[0]+' 0%,'+p[1]+' 52%,'+p[2]+' 84%, '+p[2]+' 100%)';
    if(nf<6||nf>=19){ var s=document.getElementById('sun'); s.style.opacity='.25'; s.style.background='radial-gradient(circle at 40% 35%,#eef3ff,#b9c6e6)'; s.style.boxShadow='0 0 28px 7px rgba(200,210,240,.4)'; }
  })();

  /* ---- apply dataset ---- */
  function applyData(data){
    try{ document.getElementById('tlDate').textContent=new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'}); }catch(e){}
    if(data.settings&&data.settings.motto) document.getElementById('motto').textContent=data.settings.motto;
    renderTimeline(data); renderTodo(data); renderMatrix(data); renderRoutine(data); renderBucket(data);
  }

  /* ---- auth + snapshot ---- */
  var session=null; try{ session=JSON.parse(localStorage.getItem(AUTH_KEY)||'null'); }catch(e){}
  function updateAcct(){ var b=document.getElementById('accountBtn');
    if(session&&session.user){ b.textContent=session.user.email; b.classList.add('signed'); } else { b.textContent='로그인'; b.classList.remove('signed'); } }
  function normalize(s){ return {tasks:s.tasks||[],habits:s.habits||[],sessions:s.sessions||[],settings:s.settings||{focusGoalMinutes:240}}; }
  function fetchSnapshot(){ if(!session) return;
    fetch(SUPA_URL+'/rest/v1/sundial_state?user_id=eq.'+encodeURIComponent(session.user.id)+'&select=snapshot',
      {headers:{apikey:SUPA_KEY,Authorization:'Bearer '+session.access_token}})
      .then(function(r){ if(r.status===401){ signOut(); throw 0; } return r.json(); })
      .then(function(rows){ if(rows&&rows.length&&rows[0].snapshot) applyData(normalize(rows[0].snapshot));
        else applyData({tasks:[],habits:[],sessions:[],settings:{focusGoalMinutes:240,motto:'앱에서 동기화하면 여기 나타나요.'}}); })
      .catch(function(){});
  }
  function saveSession(j){ session={access_token:j.access_token,user:{id:j.user.id,email:j.user.email}}; localStorage.setItem(AUTH_KEY,JSON.stringify(session)); updateAcct(); }
  function signOut(){ session=null; localStorage.removeItem(AUTH_KEY); updateAcct(); applyData(DEMO); }
  function authReq(path,body){ return fetch(SUPA_URL+'/auth/v1/'+path,{method:'POST',headers:{apikey:SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); }); }

  /* ---- login modal ---- */
  var scrim=document.getElementById('loginScrim'), mode='signIn';
  function setMode(m){ mode=m;
    document.getElementById('loginTitle').textContent=m==='signIn'?'로그인':'회원가입';
    document.getElementById('loginGo').textContent=m==='signIn'?'로그인':'회원가입';
    document.getElementById('loginSwitch').innerHTML=m==='signIn'?'계정이 없나요? <a id="loginToggle">회원가입</a>':'이미 계정이 있나요? <a id="loginToggle">로그인</a>';
    document.getElementById('loginToggle').addEventListener('click',function(){ setMode(m==='signIn'?'signUp':'signIn'); });
  }
  document.getElementById('accountBtn').addEventListener('click',function(){ if(session){ if(confirm('로그아웃할까요?')) signOut(); } else { document.getElementById('loginErr').textContent=''; setMode('signIn'); scrim.classList.add('open'); document.getElementById('loginEmail').focus(); } });
  document.getElementById('loginClose').addEventListener('click',function(){ scrim.classList.remove('open'); });
  scrim.addEventListener('click',function(e){ if(e.target===scrim) scrim.classList.remove('open'); });
  document.getElementById('loginToggle').addEventListener('click',function(){ setMode('signUp'); });
  document.getElementById('loginGo').addEventListener('click',doLogin);
  document.getElementById('loginPw').addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });
  function doLogin(){
    var email=document.getElementById('loginEmail').value.trim(), pw=document.getElementById('loginPw').value, err=document.getElementById('loginErr'); err.textContent='';
    if(email.indexOf('@')<0||pw.length<6){ err.textContent='이메일과 6자 이상 비밀번호를 입력해요.'; return; }
    var go=document.getElementById('loginGo'); go.disabled=true; go.textContent='…';
    authReq(mode==='signIn'?'token?grant_type=password':'signup',{email:email,password:pw}).then(function(res){
      go.disabled=false; go.textContent=mode==='signIn'?'로그인':'회원가입';
      if(!res.ok){ err.textContent=(res.j&&(res.j.error_description||res.j.msg||res.j.error))||'실패했어요.'; return; }
      if(res.j.access_token){ saveSession(res.j); scrim.classList.remove('open'); fetchSnapshot(); }
      else { err.textContent='확인 메일을 보냈어요. 인증 후 로그인해 주세요.'; setMode('signIn'); }
    }).catch(function(){ go.disabled=false; go.textContent=mode==='signIn'?'로그인':'회원가입'; err.textContent='네트워크 오류예요.'; });
  }

  /* ---- boot ---- */
  updateAcct(); applyData(DEMO); if(session) fetchSnapshot();
})();
</script>
</body>
</html>
