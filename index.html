<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>harufocus</title>
<meta name="description" content="시간을 하늘 색으로 보여주는 세로 타임라인 플래너.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='52' r='30' fill='none' stroke='%23f2c14e' stroke-width='7'/><circle cx='50' cy='18' r='6.5' fill='%23f2c14e'/></svg>">
<style>
  :root{
    --ink:#1b2436; --ink-soft:#5a6478; --line:#e6ebf3; --card:#fff; --card-2:#f6f8fc;
    --accent:#f2c14e; --sky-blue:#5b93e6;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);color:var(--ink);background:var(--card-2);-webkit-font-smoothing:antialiased}
  .app{height:100vh;height:100dvh;display:flex;flex-direction:column}

  header.bar{display:flex;align-items:center;justify-content:space-between;padding:11px 18px;
    background:var(--card);border-bottom:1px solid var(--line);z-index:5}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:-.02em}
  .brand svg{width:21px;height:21px}
  .acct{font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink);
    background:var(--card-2);border:1px solid var(--line);padding:7px 13px;border-radius:999px;
    max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .acct.signed::before{content:"●";color:#3fb46a;font-size:8px;margin-right:5px;vertical-align:1px}

  .layout{flex:1;min-height:0;display:flex}

  /* ---------- LEFT: timeline pane ---------- */
  .pane-tl{flex:0 0 42%;max-width:520px;display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0}
  .tl-top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line)}
  .tl-date{font-weight:700;font-size:14px}
  .seg{margin-left:auto;display:flex;background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:2px}
  .seg button{font-family:inherit;font-size:12.5px;font-weight:600;border:none;background:transparent;color:var(--ink-soft);
    padding:6px 12px;border-radius:8px;cursor:pointer}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .tl-body{flex:1;position:relative;min-height:0}

  /* big timeline (sky) */
  #view-big{position:absolute;inset:0;overflow:hidden;
    background:linear-gradient(180deg,#3f6fb0 0%,#77a7dd 52%,#bcd6ef 100%)}
  .tl-scroll{position:absolute;inset:0;overflow-y:auto;padding:14px 0 190px}
  .hour{position:relative;height:74px;padding-left:52px}
  .hour .lbl{position:absolute;left:14px;top:-8px;font-size:12px;color:#fff;opacity:.85;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px rgba(0,0,0,.3)}
  .hour .rule{position:absolute;left:46px;right:14px;top:0;height:1px;background:rgba(255,255,255,.22)}
  .now{position:absolute;left:8px;right:12px;z-index:4;display:flex;align-items:center;gap:8px}
  .now .pill{background:var(--accent);color:#3a2c05;font-weight:800;font-size:11px;padding:3px 8px;border-radius:8px}
  .now .wire{flex:1;height:2px;background:var(--accent);border-radius:2px}
  .block{position:absolute;left:52px;right:14px;border-radius:12px;padding:8px 12px;z-index:3;color:#fff;
    font-weight:600;font-size:13.5px;box-shadow:0 6px 15px rgba(20,30,60,.22);display:flex;align-items:center;gap:8px;
    border:1px solid rgba(255,255,255,.4)}
  .block small{margin-left:auto;font-weight:600;opacity:.8;font-size:11px}
  .tl-empty{position:absolute;left:0;right:0;top:46%;text-align:center;color:#fff;opacity:.9;font-size:14px;padding:0 20px}
  .tl-tree{position:absolute;bottom:0;right:12px;width:88px;z-index:2;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
  .tl-hills{position:absolute;left:0;right:0;bottom:0;height:150px;width:100%;object-fit:cover;object-position:center bottom;mix-blend-mode:soft-light;opacity:.9;z-index:1;pointer-events:none}

  /* mosaic */
  #view-mosaic{position:absolute;inset:0;overflow-y:auto;background:var(--card-2);padding:14px 14px 24px;display:none}
  .mo-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px}
  .mo-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .mo-day{width:52px;font-size:12px;color:var(--ink-soft);flex:0 0 auto}
  .mo-day.today{color:var(--ink);font-weight:700}
  .mo-track{flex:1;display:grid;grid-template-columns:repeat(18,1fr);gap:3px}
  .mo-cell{height:16px;border-radius:4px;background:#e7ecf4}
  .mo-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;font-size:12px;color:var(--ink-soft)}
  .mo-legend span{display:inline-flex;align-items:center;gap:5px}
  .mo-legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

  /* ---------- RIGHT: tabs pane ---------- */
  .pane-tabs{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
  .tabrow{display:flex;gap:4px;padding:10px 14px 0;background:var(--card);border-bottom:1px solid var(--line)}
  .tabrow button{font-family:inherit;font-size:14px;font-weight:600;border:none;background:transparent;color:var(--ink-soft);
    padding:11px 15px 13px;border-radius:10px 10px 0 0;cursor:pointer;position:relative}
  .tabrow button.on{color:var(--ink)}
  .tabrow button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--accent)}
  .tabbody{flex:1;overflow-y:auto;padding:16px}
  .view{display:none}
  .view.on{display:block}
  .view h2{font-size:19px;letter-spacing:-.02em}
  .view .sub{color:var(--ink-soft);font-size:13px;margin:3px 0 15px}

  /* to-do */
  .todo{display:flex;flex-direction:column;gap:9px}
  .task{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 13px}
  .check{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink-soft);flex:0 0 auto;cursor:pointer;display:grid;place-items:center}
  .check.done{background:#6bbf7a;border-color:#6bbf7a}
  .check.done::after{content:"✓";color:#fff;font-size:13px;font-weight:800}
  .swatch{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
  .t-title{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .task.done .t-title{text-decoration:line-through;color:var(--ink-soft)}
  .t-time{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .star{cursor:pointer;color:#d3d9e4;font-size:17px}
  .star.on{color:var(--accent)}
  .send{border:none;background:var(--card-2);color:var(--sky-blue);font-family:inherit;font-size:12px;font-weight:700;
    cursor:pointer;border-radius:9px;padding:6px 9px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .send:hover{background:#e9f0fb}
  .send.placed{color:#3fb46a;background:#e9f7ee}

  /* matrix */
  .matrix{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .quad{border-radius:14px;padding:12px;min-height:120px;border:1px solid var(--line)}
  .quad h3{font-size:12.5px;font-weight:700;margin-bottom:8px}
  .mtask{background:rgba(255,255,255,.8);border-radius:9px;padding:7px 9px;font-size:12.5px;margin-bottom:6px}
  .q1{background:#fce9ec}.q2{background:#e5f6ea}.q3{background:#fdf1dd}.q4{background:#eef1f6}
  .q1 h3{color:#c0455f}.q2 h3{color:#3f9a58}.q3 h3{color:#c58a1e}.q4 h3{color:#6b7688}

  /* routine */
  .routines{display:flex;flex-direction:column;gap:11px}
  .routine{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 14px}
  .r-top{display:flex;align-items:center;gap:10px}
  .r-emoji{font-size:19px}.r-name{font-weight:700}.r-meta{margin-left:auto;font-size:12px;color:var(--ink-soft)}
  .play{width:31px;height:31px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:11px;margin-left:6px;cursor:pointer}
  .days{display:flex;gap:5px;margin-top:10px}
  .day{width:27px;height:27px;border-radius:8px;display:grid;place-items:center;font-size:11.5px;font-weight:700;background:var(--card-2);color:var(--ink-soft);border:1px solid var(--line)}
  .day.on{background:#4bb6bd;color:#fff;border-color:#4bb6bd}
  .empty{color:var(--ink-soft);font-size:14px;text-align:center;padding:26px 10px}
  /* 작업 추가/삭제 (요청: 웹 기능) */
  .addrow{display:flex;gap:8px;margin:10px 0}
  .addrow input{flex:1;font-family:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
  .addrow button{font-family:inherit;font-weight:700;font-size:13.5px;border:0;border-radius:10px;padding:0 16px;background:var(--accent);color:#3a2c05;cursor:pointer}
  .task .del{margin-left:6px;border:0;background:transparent;color:var(--ink-soft);font-size:18px;line-height:1;cursor:pointer;opacity:.55;padding:0 2px}
  .task .del:hover{opacity:1;color:#e0564e}
  .quad .qadd{margin-top:8px;width:100%;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink-soft);background:transparent;border:1px dashed var(--line);border-radius:9px;padding:8px 0;cursor:pointer}
  .quad .mtask{display:flex;align-items:center;gap:6px}
  .quad .mtask .del{margin-left:auto;border:0;background:transparent;color:var(--ink-soft);font-size:16px;line-height:1;cursor:pointer;opacity:.5}
  .quad .mtask .del:hover{opacity:1;color:#e0564e}

  /* ---------- mobile bottom bar ---------- */
  .mbar{display:none;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .mbtn{flex:1;border:none;background:transparent;font-family:inherit;cursor:pointer;padding:5px 2px;
    display:flex;flex-direction:column;align-items:center;gap:3px;color:#9aa3b2;font-size:10.5px;font-weight:600}
  .mbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .mbtn.on{color:var(--ink)}.mbtn.on svg{stroke:var(--sky-blue)}

  /* ---------- responsive ---------- */
  @media(max-width:860px){
    .layout{display:block;position:relative}
    .pane-tl,.pane-tabs{position:absolute;inset:0;max-width:none;flex:none;border-right:none;display:none}
    body[data-m="timeline"] .pane-tl{display:flex}
    body[data-m="todo"] .pane-tabs,body[data-m="matrix"] .pane-tabs,body[data-m="routine"] .pane-tabs,body[data-m="bucket"] .pane-tabs{display:flex}
    .tabrow{display:none}
    .mbar{display:flex}
  }

  /* day nav */
  .daynav{border:none;background:var(--card-2);color:var(--ink-soft);width:26px;height:26px;border-radius:8px;cursor:pointer;font-size:16px;line-height:1;flex:0 0 auto}
  .daynav:hover{background:#e9eef6;color:var(--ink)}

  /* matrix internal scroll: grid fills tabbody, rows sized by JS, cells scroll */
  .tabbody.matrix-mode{overflow:hidden}
  .tabbody.matrix-mode #view-matrix{display:flex;flex-direction:column;height:100%}
  .matrix.fit{flex:1;min-height:0}
  .matrix.fit .quad{min-height:0;overflow-y:auto}

  /* ---------- bucket ---------- */
  .bucket-wrap{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
  .bucket-scene{position:relative;width:290px;height:300px;perspective:780px;flex:0 0 auto;margin:6px auto 0}
  .tub{position:absolute;left:50%;top:54%;width:0;height:0;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.34,0,.2,1)}
  .tub>*{position:absolute;left:0;top:0}
  .wall{cursor:pointer;transition:opacity .45s,box-shadow .35s}
  .wall.dim{opacity:.32}
  .wall.sel{box-shadow:0 0 0 2px rgba(255,255,255,.85),0 12px 26px rgba(0,0,0,.28)}
  .wlabel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:16px;pointer-events:none;color:#3a3f4c;text-shadow:0 1px 1px rgba(255,255,255,.4)}
  .wlabel .wn{font-weight:800;font-size:13.5px;letter-spacing:-.02em}
  .wlabel .ws{font-size:9.5px;font-weight:600;opacity:.72;margin-top:2px}
  .wlabel .wlv{position:absolute;top:9px;right:12px;font-size:10.5px;font-weight:800;opacity:.75}
  .cap{backface-visibility:hidden}
  .bbadge{position:absolute;left:50%;top:2px;transform:translateX(-50%);color:#fff;font-weight:800;font-size:15px;padding:5px 13px;border-radius:999px;box-shadow:0 7px 16px rgba(0,0,0,.28);opacity:0;transition:opacity .3s}
  .bbadge.on{opacity:1}
  .bucket-info{flex:1;min-width:230px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px}
  .bi-top{display:flex;align-items:center;gap:9px}
  .bi-dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
  .bi-name{font-weight:800;font-size:16px}.bi-sub{font-size:12px;color:var(--ink-soft)}
  .bi-lv{margin-left:auto;color:#fff;font-weight:800;font-size:13px;padding:3px 11px;border-radius:999px}
  .bi-msg{margin-top:13px;font-size:14px;line-height:1.55}
  .bi-hint{margin-top:10px;font-size:12px;color:var(--ink-soft)}
  .bi-sides{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}
  .bi-side{display:flex;align-items:center;gap:9px;font-size:13px;cursor:pointer;padding:6px;border-radius:9px}
  .bi-side:hover{background:var(--card-2)}.bi-side.sel{background:var(--card-2);font-weight:600}
  .bi-side .nm{width:56px;flex:0 0 auto}
  .bi-side .bar{flex:1;height:8px;border-radius:5px;background:var(--line);overflow:hidden}
  .bi-side .fill{height:100%;border-radius:5px}
  .bi-side .v{width:38px;text-align:right;color:var(--ink-soft);font-variant-numeric:tabular-nums}

  /* ---------- login modal ---------- */
  .scrim{position:fixed;inset:0;z-index:30;background:rgba(15,20,40,.5);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:22px}
  .scrim.open{display:flex}
  .modal{position:relative;background:var(--card);border-radius:20px;padding:26px 22px 20px;width:100%;max-width:360px;box-shadow:0 30px 70px rgba(0,0,0,.35)}
  .modal h3{font-size:20px}.modal .msub{color:var(--ink-soft);font-size:12.5px;margin:6px 0 15px}
  .modal input{width:100%;font-family:inherit;font-size:15px;padding:12px 13px;margin-bottom:9px;border:1px solid var(--line);border-radius:12px;background:var(--card-2);outline:none}
  .modal input:focus{border-color:var(--sky-blue)}
  .modal .go{width:100%;border:none;cursor:pointer;font-family:inherit;font-size:15px;font-weight:700;padding:13px;border-radius:12px;background:var(--ink);color:#fff;margin-top:5px}
  .modal .merr{color:#d5495f;font-size:12.5px;min-height:16px;margin:2px 0 3px}
  .modal .mswitch{text-align:center;font-size:12.5px;color:var(--ink-soft);margin-top:13px}
  .modal .mswitch a{color:var(--sky-blue);font-weight:600;cursor:pointer}
  .modal .mclose{position:absolute;top:12px;right:14px;border:none;background:transparent;font-size:18px;color:var(--ink-soft);cursor:pointer}
</style>
</head>
<body data-m="todo">
<div class="app">
  <header class="bar">
    <div class="brand">
      <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="54" r="28" fill="none" stroke="#f2c14e" stroke-width="7"/><circle cx="50" cy="20" r="6.5" fill="#f2c14e"/></svg>
      harufocus
    </div>
    <button class="acct" id="accountBtn">로그인</button>
  </header>

  <div class="layout">
    <!-- LEFT: timeline -->
    <section class="pane-tl">
      <div class="tl-top">
        <button class="daynav" id="dayPrev" aria-label="이전 날">‹</button>
        <span class="tl-date" id="tlDate">오늘</span>
        <button class="daynav" id="dayNext" aria-label="다음 날">›</button>
        <div class="seg">
          <button id="segBig" class="on" data-mode="big">큰 타임라인</button>
          <button id="segMo" data-mode="mosaic">모자이카</button>
        </div>
      </div>
      <div class="tl-body">
        <div id="view-big">
          <img class="tl-hills" src="assets/hills.png" alt="">
          <div class="tl-scroll" id="tlScroll"></div>
          <img class="tl-tree" src="assets/tree.png" alt="">
        </div>
        <div id="view-mosaic">
          <div class="mo-sub">최근 7일을 한눈에. 색은 영역, 칸은 시간(6시–24시).</div>
          <div id="moGrid"></div>
          <div class="mo-legend" id="moLegend"></div>
        </div>
      </div>
    </section>

    <!-- RIGHT: tabs -->
    <section class="pane-tabs">
      <div class="tabrow">
        <button class="on" data-tab="todo">할일</button>
        <button data-tab="matrix">매트릭스</button>
        <button data-tab="routine">루틴</button>
        <button data-tab="bucket">물통</button>
      </div>
      <div class="tabbody">
        <section class="view on" id="view-todo">
          <h2>할 일</h2><div class="sub">별표로 위로 · 체크로 완료 · <b>→ 타임라인</b>으로 오늘 일정에 배치.</div>
          <div class="addrow"><input id="todoAdd" placeholder="할 일 추가…" maxlength="120"><button id="todoAddBtn">추가</button></div>
          <div class="todo" id="todoList"></div>
        </section>
        <section class="view" id="view-matrix">
          <h2>매트릭스</h2><div class="sub">중요도와 급함으로 네 칸에 나눠 담아요.</div>
          <div class="matrix" id="matrixGrid"></div>
        </section>
        <section class="view" id="view-routine">
          <h2>루틴</h2><div class="sub">요일마다 반복되는 일.</div>
          <div class="routines" id="routineList"></div>
        </section>
        <section class="view" id="view-bucket">
          <h2>물통</h2><div class="sub">집중한 시간이 물통을 채워요. 옆면을 누르면 그 영역이 앞으로 돌아와요.</div>
          <div class="bucket-wrap">
            <div class="bucket-scene"><div class="bbadge" id="bBadge">10 / 10</div><div class="tub" id="tub"></div></div>
            <div class="bucket-info" id="bInfo"></div>
          </div>
        </section>
      </div>
    </section>
  </div>

  <nav class="mbar">
    <button class="mbtn" data-tab="timeline"><svg viewBox="0 0 24 24"><path d="M3 18h18M7 18a5 5 0 0 1 10 0M12 4v3M5 8l2 2M19 8l-2 2"/></svg>타임라인</button>
    <button class="mbtn on" data-tab="todo"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>할일</button>
    <button class="mbtn" data-tab="matrix"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>매트릭스</button>
    <button class="mbtn" data-tab="routine"><svg viewBox="0 0 24 24"><path d="M4 7h11a4 4 0 0 1 4 4M20 17H9a4 4 0 0 1-4-4M16 4l3 3-3 3M8 20l-3-3 3-3"/></svg>루틴</button>
    <button class="mbtn" data-tab="bucket"><svg viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>물통</button>
  </nav>
</div>

<div class="scrim" id="loginScrim">
  <div class="modal">
    <button class="mclose" id="loginClose">✕</button>
    <h3 id="loginTitle">로그인</h3>
    <div class="msub">harufocus 계정으로 로그인하면 아이폰·아이패드와 같은 데이터를 봐요.</div>
    <input id="loginEmail" type="email" placeholder="이메일">
    <input id="loginPw" type="password" placeholder="비밀번호 (6자 이상)">
    <div class="merr" id="loginErr"></div>
    <button class="go" id="loginGo">로그인</button>

  }
  document.getElementById('dayPrev').addEventListener('click',function(){dayOffset--;renderBig();});
  document.getElementById('dayNext').addEventListener('click',function(){dayOffset++;renderBig();});

  /* ---------- mosaic (last 7 days) ---------- */
  function renderMosaic(){
    var grid=document.getElementById('moGrid');grid.innerHTML='';
    var hours=[];for(var h=6;h<24;h++)hours.push(h);
    for(var off=0;off>=-6;off--){
      var d=new Date();d.setDate(d.getDate()+off);var key=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
      var slots={};
      (DATA.tasks||[]).forEach(function(t){
        if(!t.scheduledStart||!t.durationMin)return;if(dateKey(t.scheduledStart)!==key)return;
        var s=new Date(t.scheduledStart),sh=s.getHours(),eh=sh+Math.ceil(t.durationMin/60);
        for(var hh=sh;hh<eh;hh++)if(slots[hh]==null)slots[hh]=t.categoryID;
      });
      var lbl=off===0?'오늘':off===-1?'어제':(d.getMonth()+1)+'.'+d.getDate();
      var row=document.createElement('div');row.className='mo-row';
      var cells=hours.map(function(hh){var c=slots[hh];return '<div class="mo-cell" style="'+(c?'background:'+catColor(c):'')+'"></div>';}).join('');
      row.innerHTML='<span class="mo-day'+(off===0?' today':'')+'">'+lbl+'</span><div class="mo-track">'+cells+'</div>';
      grid.appendChild(row);
    }
    var used={};(DATA.tasks||[]).forEach(function(t){if(t.scheduledStart&&t.durationMin)used[t.categoryID]=1;});
    document.getElementById('moLegend').innerHTML=Object.keys(used).map(function(k){return '<span><i style="background:'+catColor(k)+'"></i>'+catName(k)+'</span>';}).join('');
  }

  /* ---------- to-do (with send-to-timeline) ---------- */
  function nextSlotToday(){
    var used=[];(DATA.tasks||[]).forEach(function(t){if(t.scheduledStart&&t.durationMin&&dateKey(t.scheduledStart)===todayKey()){var s=new Date(t.scheduledStart);used.push([s.getHours()+s.getMinutes()/60,t.durationMin/60]);}});
    used.sort(function(a,b){return a[0]-b[0];});
    var now=new Date();var t=Math.max(TS,Math.ceil((now.getHours()+now.getMinutes()/60)*2)/2);
    for(var i=0;i<used.length;i++){if(t+0.75<=used[i][0])break;if(t<used[i][0]+used[i][1])t=used[i][0]+used[i][1];}
    return Math.min(t,23);
  }
  /* ---------- 작업 추가/삭제 (요청: 웹에서도 앱 기능) ---------- */
  function uuid(){
    var u=(window.crypto&&crypto.randomUUID)?crypto.randomUUID()
      :'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0,v=c==='x'?r:(r&0x3|0x8);return v.toString(16);});
    return u.toUpperCase();  // Swift UUID 관례
  }
  // 앱 TaskDTO의 모든 필수 필드를 채운 새 작업 (누락 시 앱 디코딩 실패 방지).
  function newTask(o){return Object.assign({
    id:uuid(),title:'',categoryID:'focus',colorKey:'',iconName:null,repeatDaysMask:0,
    scheduledStart:null,durationMin:0,isDone:false,isStarred:false,notes:'',dueDate:null,
    matrixQuadrant:0,countTarget:0,countDone:0,subtasksJSON:'[]',recurrenceRaw:'',
    reminderOffsets:[0],nudgeEnabled:false,deferredUntil:null,deferCount:0,verificationCount:0,
    focusLockUsed:false,actualFocusedSec:0,cumulativeFocusedSec:0,lastFocusedAt:null,
    createdAt:new Date().toISOString(),restSpansJSON:'[]',completedAt:null
  },o||{});}
  function addTask(o){if(!DATA.tasks)DATA.tasks=[];var t=newTask(o);DATA.tasks.push(t);renderAll();pushSnapshot();return t;}
  function deleteTask(t){DATA.tasks=(DATA.tasks||[]).filter(function(x){return x!==t;});renderAll();pushSnapshot();}
  function doTodoAdd(){var el=document.getElementById('todoAdd');var v=(el.value||'').trim();if(!v)return;addTask({title:v});el.value='';}
  // 타임라인 블록 수정 (요청): 제목·시작·길이 변경 또는 삭제. 앱과 양방향 sync.
  function editBlock(t){
    var title=prompt('제목 (비우면 삭제)',t.title);
    if(title===null)return;
    if(!title.trim()){deleteTask(t);return;}
    t.title=title.trim();
    var d=new Date(t.scheduledStart);
    var cur=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
    var tm=prompt('시작 시각 (HH:MM)',cur);
    if(tm){var m=tm.match(/^(\d{1,2}):(\d{2})$/);if(m){var nd=new Date(t.scheduledStart);nd.setHours(+m[1],+m[2],0,0);t.scheduledStart=nd.toISOString();}}
    var dur=prompt('길이(분)',String(t.durationMin||50));
    if(dur){var dv=parseInt(dur,10);if(dv>0)t.durationMin=dv;}
    renderAll();pushSnapshot();
  }

  function renderTodo(){
    var list=document.getElementById('todoList');list.innerHTML='';
    var tasks=DATA.tasks||[];
    if(!tasks.length){list.innerHTML='<div class="empty">할 일이 없어요.</div>';return;}
    var order=tasks.map(function(t,i){return i;}).sort(function(a,b){return (tasks[b].isStarred?1:0)-(tasks[a].isStarred?1:0);});
    order.forEach(function(i){
      var t=tasks[i];var placed=t.scheduledStart&&t.durationMin&&dateKey(t.scheduledStart)===todayKey();
      var row=document.createElement('div');row.className='task'+(t.isDone?' done':'');
      row.innerHTML='<span class="check'+(t.isDone?' done':'')+'"></span>'+
        '<span class="swatch" style="background:'+catColor(t.categoryID)+'"></span>'+
        '<span class="t-title">'+esc(t.title)+'</span>'+
        (placed?'<span class="t-time">'+fmtTime(t.scheduledStart)+'</span>':'')+
        '<button class="send'+(placed?' placed':'')+'">'+(placed?'✓ 오늘':'→ 타임라인')+'</button>'+
        '<span class="star'+(t.isStarred?' on':'')+'">'+(t.isStarred?'★':'☆')+'</span>'+
        '<button class="del" title="삭제">×</button>';
      row.querySelector('.del').addEventListener('click',function(){deleteTask(t);});
      row.querySelector('.check').addEventListener('click',function(){t.isDone=!t.isDone;renderTodo();pushSnapshot();});
      row.querySelector('.star').addEventListener('click',function(){t.isStarred=!t.isStarred;renderTodo();pushSnapshot();});
      row.querySelector('.send').addEventListener('click',function(){
        if(placed)return;
        var slot=nextSlotToday();t.scheduledStart=todayAt(Math.floor(slot),(slot%1)*60);if(!t.durationMin)t.durationMin=50;
        renderTodo();renderBig();renderMosaic();pushSnapshot();
        if(window.matchMedia('(max-width:860px)').matches)setTab('timeline');

      list.appendChild(row);

  function renderMatrix(){
    var g=document.getElementById('matrixGrid');g.innerHTML='';g.classList.add('fit');
    var cnt={1:0,2:0,3:0,4:0};
    [{q:1,cls:'q1',h:'🔥 급하고 중요'},{q:2,cls:'q2',h:'🌱 안 급하지만 중요'},{q:3,cls:'q3',h:'⚡ 급하지만 덜 중요'},{q:4,cls:'q4',h:'💤 안 급하고 덜 중요'}].forEach(function(qd){

      var b=document.createElement('div');b.className='quad '+qd.cls;

        '<button class="qadd" data-q="'+qd.q+'">+ 추가</button>';
      b.querySelectorAll('.mtask').forEach(function(el,k){el.querySelector('.del').addEventListener('click',function(){deleteTask(items[k]);});});

    // rows grow with their content (max of the two cells in the row); page never
    // scrolls — an overloaded cell scrolls internally (요청).
    var r1=Math.max(cnt[1],cnt[2]),r2=Math.max(cnt[3],cnt[4]);
    g.style.gridTemplateRows=(1+r1*0.7)+'fr '+(1+r2*0.7)+'fr';

    if(!(DATA.habits||[]).length){w.innerHTML='<div class="empty">루틴이 없어요.</div>';return;}
    DATA.habits.forEach(function(h){
      var mins=[];try{mins=JSON.parse(h.reminderMinutesJSON||'[]');}catch(e){}
      var t=mins.length?(Math.floor(mins[0]/60).toString().padStart(2,'0')+':'+(mins[0]%60).toString().padStart(2,'0')):catName(h.categoryID);
      var days=labels.map(function(lb,i){return '<span class="day'+(((h.weekdaysMask>>bits[i])&1)?' on':'')+'">'+lb+'</span>';}).join('');

  /* ---------- bucket (hexagon; click a side to rotate it front) ---------- */
  var SIDES=[

    {id:'study',name:'성장',sub:'복리 성장',lv:6,msg:'성장은 복리예요. 매일 조금씩 쌓여요.'},
    {id:'mind',name:'마음',sub:'차오름',lv:7,msg:'마음이 차오르고 있어요. 잠깐의 쉼도 채움이에요.'},
    {id:'health',name:'몸',sub:'움직임',lv:5,msg:'몸을 움직인 만큼 하루가 가벼워져요.'},
    {id:'life',name:'돈',sub:'꾸준함',lv:8,msg:'작은 습관이 통장을 바꿔요.'},

  var bSel=-1;
  function buildTub(){
    var tub=document.getElementById('tub');if(!tub)return;tub.innerHTML='';
    var N=6,R=92,H=150;var a=R*Math.cos(Math.PI/N),s=2*R*Math.sin(Math.PI/N);
    function box(w,h){var e=document.createElement('div');e.style.width=w+'px';e.style.height=h+'px';e.style.marginLeft=(-w/2)+'px';e.style.marginTop=(-h/2)+'px';return e;}
    var pts=[];for(var j=0;j<N;j++){var ang=(30+j*60)*Math.PI/180;pts.push((50+50*Math.cos(ang)).toFixed(1)+'% '+(50+50*Math.sin(ang)).toFixed(1)+'%');}
    var hex='polygon('+pts.join(',')+')';
    var fl=box(2*R,2*R);fl.className='cap';fl.style.background='repeating-linear-gradient(90deg,#ddb87a,#ddb87a 15px,#d3ac6a 15px,#d3ac6a 30px)';fl.style.clipPath=hex;fl.style.transform='translateY('+(H/2)+'px) rotateX(90deg)';tub.appendChild(fl);
    SIDES.forEach(function(side,i){

      var wh=(side.lv/10)*(H*0.76);

  function applyTub(){
    var tub=document.getElementById('tub'),badge=document.getElementById('bBadge');
    // 미선택: 육각 프리즘을 비스듬히 — 여러 면이 보이는 원근 (첨부1).

    tub.style.transform=bSel<0
      ? 'rotateX(24deg) rotateY(-18deg)'

    tub.querySelectorAll('.wall').forEach(function(w){
      var i=+w.dataset.i, sel=(i===bSel);

  /* ---------- tab + mode switching ---------- */
  function setTab(name){
    document.body.setAttribute('data-m',name);

    }
  }
  document.querySelectorAll('.tabrow button,.mbtn').forEach(function(b){b.addEventListener('click',function(){setTab(b.dataset.tab);});});
  function setMode(m){
    document.getElementById('segBig').classList.toggle('on',m==='big');
    document.getElementById('segMo').classList.toggle('on',m==='mosaic');
    document.getElementById('view-big').style.display=m==='big'?'block':'none';
    document.getElementById('view-mosaic').style.display=m==='mosaic'?'block':'none';
    if(m==='big')renderBig();
  }
  document.getElementById('segBig').addEventListener('click',function(){setMode('big');});
  document.getElementById('segMo').addEventListener('click',function(){setMode('mosaic');});

  /* ---------- auth + snapshot ---------- */
  var session=null;try{session=JSON.parse(localStorage.getItem(AUTH_KEY)||'null');}catch(e){}
  function updateAcct(){var b=document.getElementById('accountBtn');if(session&&session.user){b.textContent=session.user.email;b.classList.add('signed');}else{b.textContent='로그인';b.classList.remove('signed');}}
  function normalize(s){return {tasks:s.tasks||[],habits:s.habits||[],settings:s.settings||{focusGoalMinutes:240}};}

  /* 서버 스냅샷을 통째로 보관 (schemaVersion·sessions 등 앱 전용 필드 보존).
     DATA.tasks는 serverSnap.tasks와 같은 참조라 편집이 그대로 반영된다. */
  var serverSnap=null;
  function fetchSnapshot(){if(!session)return;
    fetch(SUPA_URL+'/rest/v1/sundial_state?user_id=eq.'+encodeURIComponent(session.user.id)+'&select=snapshot',{headers:{apikey:SUPA_KEY,Authorization:'Bearer '+session.access_token}})
    .then(function(r){if(r.status===401){signOut();throw 0;}return r.json();})
    .then(function(rows){
      serverSnap=(rows&&rows.length&&rows[0].snapshot)||{schemaVersion:1,tasks:[],habits:[],sessions:[],settings:null};
      DATA=normalize(serverSnap);renderAll();
    })
    .catch(function(){});
  }

  /* ---------- 양방향: 웹 편집을 서버로 올리기 (요청) ---------- */
  var WEB_DEV_KEY='harufocusWebDevice';
  function webDeviceId(){var d=localStorage.getItem(WEB_DEV_KEY);
    if(!d){d='web-'+((window.crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now()+'-'+Math.random().toString(16).slice(2)));localStorage.setItem(WEB_DEV_KEY,d);}
    return d;}
  function currentSnap(){
    serverSnap=serverSnap||{schemaVersion:1,tasks:[],habits:[],sessions:[],settings:null};
    serverSnap.tasks=DATA.tasks;serverSnap.habits=DATA.habits;if(DATA.settings)serverSnap.settings=DATA.settings;
    return serverSnap;}
  var pushTimer=null;
  function pushSnapshot(){if(!session)return;clearTimeout(pushTimer);pushTimer=setTimeout(doPush,1200);}
  function doPush(){if(!session)return;
    var body=[{user_id:session.user.id,snapshot:currentSnap(),device_id:webDeviceId(),updated_at:new Date().toISOString()}];
    fetch(SUPA_URL+'/rest/v1/sundial_state',{method:'POST',headers:{apikey:SUPA_KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(body)})
    .then(function(r){if(r.status===401)signOut();}).catch(function(){});
  }
  function saveSession(j){session={access_token:j.access_token,user:{id:j.user.id,email:j.user.email}};localStorage.setItem(AUTH_KEY,JSON.stringify(session));updateAcct();}
  function signOut(){session=null;localStorage.removeItem(AUTH_KEY);updateAcct();DATA=DEMO;renderAll();}
  function authReq(p,b){return fetch(SUPA_URL+'/auth/v1/'+p,{method:'POST',headers:{apikey:SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});});}

  var scrim=document.getElementById('loginScrim'),mode='signIn';
  function setLMode(m){mode=m;document.getElementById('loginTitle').textContent=m==='signIn'?'로그인':'회원가입';document.getElementById('loginGo').textContent=m==='signIn'?'로그인':'회원가입';
    document.getElementById('loginSwitch').innerHTML=m==='signIn'?'계정이 없나요? <a id="loginToggle">회원가입</a>':'이미 계정이 있나요? <a id="loginToggle">로그인</a>';
    document.getElementById('loginToggle').addEventListener('click',function(){setLMode(m==='signIn'?'signUp':'signIn');});}
  document.getElementById('accountBtn').addEventListener('click',function(){if(session){if(confirm('로그아웃할까요?'))signOut();}else{document.getElementById('loginErr').textContent='';setLMode('signIn');scrim.classList.add('open');document.getElementById('loginEmail').focus();}});
  document.getElementById('loginClose').addEventListener('click',function(){scrim.classList.remove('open');});
  scrim.addEventListener('click',function(e){if(e.target===scrim)scrim.classList.remove('open');});
  document.getElementById('loginToggle').addEventListener('click',function(){setLMode('signUp');});
  document.getElementById('loginGo').addEventListener('click',doLogin);
  document.getElementById('loginPw').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
  function doLogin(){var email=document.getElementById('loginEmail').value.trim(),pw=document.getElementById('loginPw').value,err=document.getElementById('loginErr');err.textContent='';
    if(email.indexOf('@')<0||pw.length<6){err.textContent='이메일과 6자 이상 비밀번호를 입력해요.';return;}
    var go=document.getElementById('loginGo');go.disabled=true;go.textContent='…';
    authReq(mode==='signIn'?'token?grant_type=password':'signup',{email:email,password:pw}).then(function(res){
      go.disabled=false;go.textContent=mode==='signIn'?'로그인':'회원가입';
      if(!res.ok){err.textContent=(res.j&&(res.j.error_description||res.j.msg||res.j.error))||'실패했어요.';return;}
      if(res.j.access_token){saveSession(res.j);scrim.classList.remove('open');fetchSnapshot();}else{err.textContent='확인 메일을 보냈어요. 인증 후 로그인해 주세요.';setLMode('signIn');}
    }).catch(function(){go.disabled=false;go.textContent=mode==='signIn'?'로그인':'회원가입';err.textContent='네트워크 오류예요.';});
  }

  /* ---------- 작업 추가 입력 배선 (요청) ---------- */
  document.getElementById('todoAddBtn').addEventListener('click',doTodoAdd);
  document.getElementById('todoAdd').addEventListener('keydown',function(e){if(e.key==='Enter')doTodoAdd();});

  /* ---------- boot ---------- */
  updateAcct();setTab('todo');renderAll();if(session)fetchSnapshot();
})();
</script>
</body>
</html>
