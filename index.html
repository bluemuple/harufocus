<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>harufocus</title>
<meta name="description" content="시간을 하늘 색으로 보여주는 세로 타임라인 플래너.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='52' r='30' fill='none' stroke='%23f2c14e' stroke-width='7'/><circle cx='50' cy='18' r='6.5' fill='%23f2c14e'/></svg>">
<style>
  :root{
    --ink:#1b2436; --ink-soft:#5a6478; --line:#e6ebf3; --card:#fff; --card-2:#f6f8fc;
    --accent:#f2c14e; --sky-blue:#5b93e6;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  *{overscroll-behavior-x:none}
  html,body{height:100%;overflow-x:hidden;touch-action:pan-y}
  .tabbody,.tl-scroll,.tl-body,.matrix.fit .quad,.routines,.todo{touch-action:pan-y}
  body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
  /* Safari 주소바가 하단 바를 덮지 않게 (요청): 화면을 고정 프레임으로. */
  html,body{height:100%}
  body{position:fixed;inset:0;width:100%;overflow:hidden;overscroll-behavior:none;
    background:linear-gradient(180deg,var(--sky-top,#2E86D8),var(--sky-bot,#AFDBF2))}
  .app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;position:relative;z-index:1}

  header.bar{display:flex;align-items:center;justify-content:space-between;padding:11px 18px;
    background:rgba(255,255,255,.82);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.5);z-index:5}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:-.02em}
  .brand svg{width:21px;height:21px}
  .acct{font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink);
    background:var(--card-2);border:1px solid var(--line);padding:7px 13px;border-radius:999px;
    max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .acct.signed::before{content:"●";color:#3fb46a;font-size:8px;margin-right:5px;vertical-align:1px}

  .layout{flex:1;min-height:0;display:flex}

  /* ---------- LEFT: timeline pane ---------- */
  .pane-tl{flex:0 0 42%;max-width:520px;display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0}
  .tl-top{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:var(--card);border-bottom:1px solid var(--line)}
  /* 첨부5: 날짜 선택 박스 (달력 아이콘 + ‹ 날짜 ›). */
  .tl-datebox{display:flex;align-items:center;gap:2px;background:var(--card-2);border:1px solid var(--line);
    border-radius:12px;padding:5px 8px;margin-right:auto}
  .tl-datebox>.ic{width:17px;height:17px;color:var(--ink-soft);margin-right:2px}
  .tl-datebox .tl-date{font-weight:800;font-size:13.5px;color:var(--ink);padding:0 2px;white-space:nowrap}
  .tl-seg{margin-left:0}
  @media(max-width:860px){.tl-top .tl-seg{display:none}}
  .tladd{margin-left:8px;border:0;background:var(--sky-blue);color:#fff;font-family:inherit;font-weight:700;font-size:13px;border-radius:9px;padding:7px 13px;cursor:pointer}
  .tledit{margin-left:8px;border:1px solid var(--line);background:var(--card-2);color:var(--ink-soft);font-family:inherit;font-weight:700;font-size:13px;border-radius:9px;padding:7px 13px;cursor:pointer}
  .tledit.on{background:var(--sky-blue);color:#fff;border-color:var(--sky-blue)}
  /* 편집 모드: 모든 블록의 삭제·재생 버튼이 항상 보인다 (요청: 폰서도 삭제·이동) */
  #tlScroll.editing .block{cursor:move}
  #tlScroll.editing .block .bplay,#tlScroll.editing .block .bx{opacity:1}
  #tlScroll.editing .block-resize::after{background:rgba(255,255,255,.95)}
  #tlScroll.editing .block{box-shadow:0 0 0 2px rgba(255,255,255,.6),0 6px 15px rgba(20,30,60,.22)}
  /* 페이지 우하단 + FAB (요청: 앱 파리티) — 할일·매트릭스 공용. */
  .page-fab{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom));width:56px;height:56px;
    border-radius:50%;border:0;background:var(--sky-blue);color:#fff;box-shadow:0 8px 20px rgba(20,60,120,.28);
    cursor:pointer;display:grid;place-items:center;z-index:15}
  @media(max-width:860px){.page-fab{bottom:calc(78px + env(safe-area-inset-bottom))}}
  @media(min-width:861px){.page-fab{position:absolute}}
  h2{position:relative}
  .h2-sub{font-size:16px;font-weight:400;color:var(--ink-soft);margin-left:6px}
  .tladd:hover{filter:brightness(1.05)}
  .tl-date{font-weight:700;font-size:14px}
  .seg{margin-left:auto;display:flex;background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:2px}
  .seg button{font-family:inherit;font-size:12.5px;font-weight:600;border:none;background:transparent;color:var(--ink-soft);
    padding:6px 12px;border-radius:8px;cursor:pointer}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  /* 루틴 편집 시트 (요청). */
  .hseg{margin-left:0;width:100%;margin:6px 0}
  .hseg button{flex:1}
  .hcolors{display:flex;gap:12px;justify-content:space-between;margin:10px 0 4px;flex-wrap:wrap}
  .hcol{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
  .hcol .sw{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff}
  .hcol .nm{font-size:11px;color:var(--ink-soft)}
  .hdays{display:flex;gap:6px;margin:6px 0;justify-content:space-between}
  .hday{flex:1;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card-2);color:var(--ink-soft);font-weight:800;font-size:13px;cursor:pointer}
  .hday.on{background:var(--sky-blue);color:#fff;border-color:var(--sky-blue)}
  .hinterval{display:flex;align-items:center;justify-content:space-between;margin:6px 0;font-size:14px;font-weight:600}
  .hrow{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
  .tl-body{flex:1;position:relative;min-height:0}

  /* big timeline (sky) */
  #view-big{position:absolute;inset:0;overflow:hidden;
    background:linear-gradient(180deg,var(--tl-top,#3f6fb0) 0%,var(--tl-mid,#77a7dd) 55%,var(--tl-bot,#bcd6ef) 100%)}
  /* 시간축에 고정된 해·달 — 스크롤하면 함께 움직인다 (요청). */
  .tl-sun{position:absolute;left:50%;width:64px;height:64px;border-radius:50%;transform:translateX(-50%);
    background:radial-gradient(circle at 50% 45%,#fff8dc,#ffe89a 45%,rgba(255,224,150,0) 72%);
    box-shadow:0 0 40px 14px rgba(255,231,150,.55);pointer-events:none;z-index:0}
  .tl-moon{position:absolute;left:64%;width:34px;height:34px;pointer-events:none;z-index:0;
    filter:drop-shadow(0 0 10px rgba(210,225,255,.5))}
  .tl-scroll{position:absolute;inset:0;overflow-y:auto;padding:14px 0 190px}
  .hour{position:relative;height:74px;padding-left:52px}
  .hour .lbl{position:absolute;left:14px;top:-8px;font-size:12px;color:#fff;opacity:.85;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px rgba(0,0,0,.3)}
  .hour .rule{position:absolute;left:46px;right:14px;top:0;height:1px;background:rgba(255,255,255,.22)}
  .now{position:absolute;left:8px;right:12px;z-index:4;display:flex;align-items:center;gap:8px}
  .now .pill{background:var(--accent);color:#3a2c05;font-weight:800;font-size:11px;padding:3px 8px;border-radius:8px}
  .now .wire{flex:1;height:2px;background:var(--accent);border-radius:2px}
  .block{position:absolute;left:52px;right:14px;border-radius:12px;padding:8px 12px;z-index:3;color:#fff;
    font-weight:600;font-size:13.5px;box-shadow:0 6px 15px rgba(20,30,60,.22);display:flex;align-items:center;gap:8px;
    border:1px solid rgba(255,255,255,.4)}
  .block small{margin-left:auto;font-weight:600;opacity:.8;font-size:11px}
  /* 블록 액션 (요청: 이동·삭제·재생) — 호버 시 노출, 모바일은 항상. */
  .block .bplay,.block .bx{border:0;background:rgba(255,255,255,.28);color:#fff;width:22px;height:22px;border-radius:50%;
    font-size:11px;line-height:1;cursor:pointer;flex:0 0 auto;opacity:0;transition:opacity .15s;display:grid;place-items:center}
  .block:hover .bplay,.block:hover .bx{opacity:1}
  .block .bx{font-size:15px}
  .block .bplay:hover,.block .bx:hover{background:rgba(255,255,255,.5)}
  @media(hover:none){.block .bplay,.block .bx{opacity:.9}}
  .block-resize{position:absolute;left:0;right:0;bottom:0;height:12px;cursor:ns-resize;border-radius:0 0 12px 12px}
  .block-resize::after{content:"";position:absolute;left:50%;bottom:3px;transform:translateX(-50%);width:26px;height:3px;border-radius:3px;background:rgba(255,255,255,.6)}
  .tl-empty{position:absolute;left:0;right:0;top:46%;text-align:center;color:#fff;opacity:.9;font-size:14px;padding:0 20px}
  .tl-tree{position:absolute;bottom:0;right:12px;width:88px;z-index:2;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
  .tl-hills{position:absolute;left:0;right:0;bottom:0;height:150px;width:100%;object-fit:cover;object-position:center bottom;mix-blend-mode:soft-light;opacity:.9;z-index:1;pointer-events:none}

  /* mosaic */
  #view-mosaic{position:absolute;inset:0;overflow-y:auto;background:var(--card-2);padding:14px 14px 24px;display:none}
  .mo-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px}
  .mo-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .mo-day{width:52px;font-size:12px;color:var(--ink-soft);flex:0 0 auto}
  .mo-day.today{color:var(--ink);font-weight:700}
  .mo-track{flex:1;display:grid;grid-template-columns:repeat(18,1fr);gap:3px}
  .mo-cell{height:16px;border-radius:4px;background:#e7ecf4}
  .mo-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;font-size:12px;color:var(--ink-soft)}
  .mo-legend span{display:inline-flex;align-items:center;gap:5px}
  .mo-legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

  /* ---------- RIGHT: tabs pane ---------- */
  .pane-tabs{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;
    background:linear-gradient(180deg,var(--sky-top,#2E86D8),var(--sky-bot,#AFDBF2));position:relative}
  .pane-tabs::after{content:"";position:absolute;left:0;right:0;bottom:0;height:120px;pointer-events:none;z-index:0;
    background:url(assets/hills.png) bottom/cover no-repeat;opacity:.5}
  .tabrow{display:flex;gap:4px;padding:10px 14px 0;background:var(--card);border-bottom:1px solid var(--line)}
  .tabrow button{font-family:inherit;font-size:14px;font-weight:600;border:none;background:transparent;color:var(--ink-soft);
    padding:11px 15px 13px;border-radius:10px 10px 0 0;cursor:pointer;position:relative}
  .tabrow button.on{color:var(--ink)}
  .tabrow button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--accent)}
  .tabbody{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:16px;position:relative;z-index:1}
  .pane-tabs > h2,.view > h2{color:#fff;text-shadow:0 1px 4px rgba(20,40,80,.35)}
  .view{display:none}
  .view.on{display:block}
  .view h2{font-size:19px;letter-spacing:-.02em}
  .view .sub{color:var(--ink-soft);font-size:13px;margin:3px 0 15px}

  /* to-do */
  .todo{display:flex;flex-direction:column;gap:9px}
  .task{position:relative;display:flex;align-items:stretch;background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.7);border-radius:16px;box-shadow:0 4px 14px rgba(20,40,80,.10);overflow:hidden}
  .check{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink-soft);flex:0 0 auto;cursor:pointer;display:grid;place-items:center}
  .check.done{background:#6bbf7a;border-color:#6bbf7a}
  .check.done::after{content:"✓";color:#fff;font-size:13px;font-weight:800}
  .swatch{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
  .task-inner{display:flex;align-items:center;gap:11px;flex:1;min-width:0;padding:11px 13px;background:#fff;position:relative;z-index:1;touch-action:pan-y;border-radius:16px}
  /* 스와이프 4버튼 (앱 파리티): 좌우 그룹, 각 그룹 2버튼. 색·아이콘 앱과 동일. */
  .swipe-grp{position:absolute;top:0;bottom:0;width:128px;display:flex;z-index:0;visibility:hidden}
  .swipe-grp.lead{left:0}.swipe-grp.trail{right:0}
  .task.sw-left .swipe-grp.lead,.task.sw-right .swipe-grp.trail{visibility:visible}
  .sa{flex:1;height:100%;border:0;color:#fff;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:3px}
  .sa b{font-size:10px;font-weight:800}
  .sa svg{width:22px;height:22px}
  .sa-tomorrow{background:#9B4DDB}.sa-matrix{background:#0E90A6}
  .sa-timeline{background:#2E7DF6}.sa-delete{background:#F5352B}
  .mx-pick{position:absolute;inset:0;z-index:3;display:none;grid-template-columns:repeat(4,1fr)}
  .task.mx-open .mx-pick{display:grid}
  .mx-pick button{border:0;color:#fff;font-family:inherit;font-size:11px;font-weight:800;cursor:pointer;line-height:1.2}
  .t-main{flex:1;min-width:0}
  .t-title{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .task.done .t-title{text-decoration:line-through;color:var(--ink-soft)}
  .t-meta{display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap}
  .t-dur{font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .t-hint{font-size:10.5px;font-weight:700;color:var(--ink-soft);background:var(--card-2);border-radius:999px;padding:1px 7px}
  .ic{width:1.06em;height:1.06em;vertical-align:-0.16em;display:inline-block}
  .t-memo{border:0;background:transparent;font-size:15px;cursor:pointer;opacity:.6;padding:0 2px;color:var(--ink-soft)}
  .memo-view{min-height:60px;font-size:14.5px;line-height:1.55;color:var(--ink);white-space:pre-wrap;word-break:break-word;cursor:text;padding:4px 2px}
  .memo-view:empty::before{content:"메모가 비어 있어요. 편집을 눌러 작성하세요.";color:var(--ink-soft)}
  .memo-view b{font-weight:800}.memo-view em{font-style:italic}
  .memo-view ul,.memo-view ol{margin:4px 0 4px 18px}
  .memo-edit{width:100%;min-height:140px;font-family:inherit;font-size:16px;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--card-2);resize:vertical;box-sizing:border-box}
  .t-memo:hover{opacity:1}
  .t-time{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  /* 스와이프 대신 호버로 액션 버튼 노출 (요청): 데스크톱은 호버 시, 모바일은 항상. */
  .task .send,.task .play,.task .del,.task .t-memo,
  .mtask .play,.mtask .del,.mtask .t-memo{opacity:0;transition:opacity .15s}
  .task:hover .send,.task:hover .play,.task:hover .del,.task:hover .t-memo,
  .mtask:hover .play,.mtask:hover .del,.mtask:hover .t-memo{opacity:.9}
  .task:hover .del:hover,.task:hover .play:hover,.mtask:hover .del:hover,.mtask:hover .play:hover{opacity:1}
  @media(hover:none){.task .send,.task .play,.task .del,.task .t-memo,
    .mtask .play,.mtask .del,.mtask .t-memo{opacity:.85}}
  .star{cursor:pointer;color:#d3d9e4;font-size:17px}
  .star.on{color:var(--accent)}
  .send{border:none;background:var(--card-2);color:var(--sky-blue);font-family:inherit;font-size:12px;font-weight:700;
    cursor:pointer;border-radius:9px;padding:6px 9px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .send:hover{background:#e9f0fb}
  .send.placed{color:#3fb46a;background:#e9f7ee}

  /* matrix */
  .matrix{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  /* 매트릭스 셀 — 앱처럼 하늘 위 반투명 카드 (요청). */
  .quad{border-radius:16px;padding:12px;min-height:120px;border:1px solid rgba(255,255,255,.55);
    background:rgba(255,255,255,.18)!important;backdrop-filter:blur(2px)}
  .quad h3{font-size:12.5px;font-weight:800;margin-bottom:8px;color:#fff;text-shadow:0 1px 3px rgba(20,40,80,.4)}
  .mtask{background:rgba(255,255,255,.96);border-radius:11px;padding:8px 10px;font-size:12.5px;margin-bottom:6px;box-shadow:0 3px 10px rgba(20,40,80,.12)}
  .q1,.q2,.q3,.q4{background:rgba(255,255,255,.18)}
  .q1 h3{color:#c0455f}.q2 h3{color:#3f9a58}.q3 h3{color:#c58a1e}.q4 h3{color:#6b7688}

  /* routine */
  .routines{display:flex;flex-direction:column;gap:11px}
  /* 루틴 — 앱 카드형(요청): 색점+이름+매일+재생+streak, 큰 요일원, 메시지. */
  .r-weekbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .r-weeklabel{font-weight:800;font-size:15px;color:#fff;text-shadow:0 1px 3px rgba(20,40,80,.4)}
  .seg.r-wm{margin-left:auto}
  .routine{background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.5);border-radius:18px;padding:16px 16px 14px;box-shadow:0 6px 18px rgba(20,40,80,.12);max-width:100%;overflow:hidden;backdrop-filter:blur(3px)}
  .routine+.routine{margin-top:14px}
  .routine .days{margin-top:12px;display:flex;gap:6px;justify-content:space-between}
  .r-top{display:flex;align-items:center;gap:11px}
  .r-dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
  .r-emoji{font-size:19px}
  .r-nk{flex:1;min-width:0}
  .r-name{font-weight:800;font-size:17px;color:#20304a}
  .r-sched{font-size:12.5px;color:var(--ink-soft);margin-top:1px}
  .r-play{width:44px;height:38px;border-radius:12px;border:0;background:rgba(255,255,255,.5);color:var(--sky-blue);cursor:pointer;display:grid;place-items:center}
  .r-play svg{width:18px;height:18px}
  .r-streakbox{display:flex;align-items:center;gap:4px;font-size:15px;font-weight:800;color:#e8912a}
  .r-streakbox svg{width:16px;height:16px}
  .play{width:31px;height:31px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:11px;margin-left:6px;cursor:pointer}
  .r-daycol{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
  .r-daycol .wl{font-size:12px;font-weight:700;color:var(--ink-soft)}
  .rday{width:100%;max-width:44px;aspect-ratio:1;border-radius:50%;border:2px solid var(--rc,#7fc6cc);
    background:rgba(255,255,255,.35);cursor:pointer;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:800;padding:0}
  .rday.on{background:var(--rc,#4bb6bd);border-color:var(--rc,#4bb6bd)}
  .rday.today{box-shadow:0 0 0 2px rgba(255,255,255,.7)}
  .rday .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.6}
  .r-msg{margin-top:11px;font-size:13px;color:var(--ink-soft)}
  .r-del{border:0;background:transparent;color:var(--ink-soft);font-size:18px;line-height:1;cursor:pointer;opacity:.5}
  .r-del:hover{opacity:1;color:#e0564e}
  .routine:hover .r-del{opacity:.8}
  @media(hover:none){.r-del{opacity:.6}}
  /* 삭제(×)도 호버 전엔 숨김 (요청: 버튼은 호버 시 노출) — 위의 기본
     opacity 규칙들이 이 아래에 있어 !important 없이 마지막 규칙으로 이긴다. */
  @media(hover:hover){
    .task:not(:hover) .del,.quad .mtask:not(:hover) .del,.routine:not(:hover) .del{opacity:0}
  }
  .empty{color:var(--ink-soft);font-size:14px;text-align:center;padding:26px 10px}
  /* 작업 추가/삭제 (요청: 웹 기능) */
  .addrow{display:flex;gap:8px;margin:10px 0}
  .addrow input{flex:1;font-family:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
  .addrow button{font-family:inherit;font-weight:700;font-size:13.5px;border:0;border-radius:10px;padding:0 16px;background:var(--accent);color:#3a2c05;cursor:pointer}
  .task .del{margin-left:6px;border:0;background:transparent;color:var(--ink-soft);font-size:18px;line-height:1;cursor:pointer;opacity:.55;padding:0 2px}
  .task .del:hover{opacity:1;color:#e0564e}
  .quad .qadd{margin-top:8px;width:100%;font-family:inherit;font-size:12.5px;font-weight:700;color:#fff;background:rgba(255,255,255,.14);border:1px dashed rgba(255,255,255,.6);border-radius:9px;padding:8px 0;cursor:pointer}
  .quad .mtask{display:flex;align-items:center;gap:7px}
  .mck{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink-soft);flex:0 0 auto;cursor:pointer;display:grid;place-items:center;font-size:11px;color:#fff}
  .mck.on{background:#6bbf7a;border-color:#6bbf7a}
  .mt-main{flex:1;min-width:0}
  .mt-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mtask.done .mt-title{text-decoration:line-through;color:var(--ink-soft)}
  .mtask .play{width:26px;height:26px;font-size:10px;margin-left:0}
  .quad .mtask .del{margin-left:auto;border:0;background:transparent;color:var(--ink-soft);font-size:16px;line-height:1;cursor:pointer;opacity:.5}
  .quad .mtask .del:hover{opacity:1;color:#e0564e}

  /* 주간/월간 캘린더 스트립 (앱 CalendarHeader 파리티, 요청). */
  /* 우상단 플로팅 유틸 (요청). */
  .util{position:fixed;top:calc(8px + env(safe-area-inset-top));right:10px;z-index:40;display:flex;gap:6px}
  .util .acct{background:rgba(255,255,255,.82);backdrop-filter:blur(4px);box-shadow:0 2px 8px rgba(20,40,80,.18)}
  body[data-m="timeline"] .util{display:none}
  .util .acct{padding:7px 9px;font-size:12px;max-width:none}
  .util #statsBtn,.util #settingsBtn{width:34px;height:34px;display:grid;place-items:center;padding:0}
  .util .acct .ic{width:17px;height:17px}
  /* 요일 칩 — 누르면 캘린더 스트립 펼침 (요청: 평소 숨김, 내용 최대화). */
  .dow-toggle{font-family:inherit;font-size:13px;font-weight:600;color:rgba(255,255,255,.9);
    background:rgba(255,255,255,.18);border:0;border-radius:999px;padding:3px 11px;margin-left:6px;cursor:pointer;
    vertical-align:middle;text-shadow:0 1px 2px rgba(20,40,80,.3)}
  .dow-toggle::after{content:" ⌄";font-size:11px}
  .dow-toggle.open::after{content:" ⌃"}
  .calstrip{margin:2px 0 12px;color:#fff;display:none}
  .calstrip.open{display:block}
  .sec-h{font-size:13px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(20,40,80,.4);margin:14px 2px 8px}
  .sec-h:first-child{margin-top:0}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
  .cal-wd{font-size:11px;font-weight:700;opacity:.8;padding-bottom:4px}
  .cal-wd.sun{color:#ffb4b4}.cal-wd.sat{color:#bcd4ff}
  .cal-cell{padding:3px 0;cursor:pointer;position:relative}
  .cal-num{width:34px;height:34px;line-height:34px;margin:0 auto;border-radius:50%;font-size:15px;font-weight:600;
    text-shadow:0 1px 2px rgba(20,40,80,.35)}
  .cal-cell.dim .cal-num{opacity:.35}
  .cal-cell.sel .cal-num{background:rgba(255,255,255,.32);font-weight:800}
  .cal-cell.today .cal-num{color:#0d2a52;background:#bfe0ff}
  .cal-dots{display:flex;gap:2px;justify-content:center;height:5px;margin-top:1px}
  .cal-dots i{width:4px;height:4px;border-radius:50%}
  .cal-toggle{display:block;margin:2px auto 0;border:0;background:none;color:#fff;opacity:.75;cursor:pointer;font-size:16px;line-height:1}

  /* ---------- 공용 캡처바 (앱 CaptureBar 파리티, 요청) ---------- */
  .cap-wrap{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card-2);
    border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(20,40,80,.12);display:none;
    padding:8px 10px calc(6px + env(safe-area-inset-bottom));touch-action:none}
  .cap-wrap.open{display:block}
  @media(min-width:861px){.cap-wrap{left:auto;right:24px;bottom:24px;width:420px;border-radius:16px;border:1px solid var(--line)}}
  .cap-icons{display:flex;justify-content:space-between;gap:4px;padding:8px 2px 6px}
  .cap-opt{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;
    color:var(--ink-soft);cursor:pointer;padding:4px 0;font-family:inherit}
  .cap-opt.on{color:var(--sky-blue)}
  .cap-opt .ic{width:26px;height:26px}
  .cap-opt b{font-size:10.5px;font-weight:800}
  .cap-input{display:flex;align-items:center;gap:9px;padding:6px 2px 2px}
  .cap-dot{width:22px;height:22px;border-radius:50%;border:2px solid rgba(0,0,0,.08);flex:0 0 auto;cursor:pointer;padding:0}
  .cap-icon{width:26px;height:26px;border:0;background:none;color:var(--ink-soft);cursor:pointer;flex:0 0 auto;display:grid;place-items:center}
  .cap-input input{flex:1;border:0;background:none;font-family:inherit;font-size:16px;color:var(--ink);min-width:0}
  .cap-input input:focus{outline:none}
  .cap-submit{width:34px;height:34px;border-radius:50%;border:0;background:var(--ink-soft);color:#fff;
    display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
  .cap-submit:disabled{opacity:.4}
  .cap-detail{max-height:46vh;overflow-y:auto}
  .cap-panel{padding:8px 4px}
  .cap-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .cap-chip{font-family:inherit;font-size:12.5px;font-weight:700;border:1px solid var(--line);background:#fff;
    color:var(--ink);border-radius:999px;padding:7px 13px;cursor:pointer}
  .cap-chip.on{background:var(--sky-blue);border-color:var(--sky-blue);color:#fff}
  .cap-done{margin-left:auto;font-family:inherit;font-size:12.5px;font-weight:800;border:0;background:var(--sky-blue);
    color:#fff;border-radius:999px;padding:8px 15px;cursor:pointer}
  .cap-slider{width:100%;accent-color:var(--sky-blue);margin:6px 0}
  .cap-days{display:flex;gap:6px}
  .cap-day{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink-soft);
    font-size:12px;font-weight:800;cursor:pointer}
  .cap-day.on{background:var(--sky-blue);border-color:var(--sky-blue);color:#fff}
  .cap-note textarea{width:100%;height:90px;border:1px solid var(--line);border-radius:11px;padding:9px 11px;
    font-family:inherit;font-size:14px;resize:vertical;box-sizing:border-box}
  .cap-fmtrow{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .cap-fmt{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer;
    display:grid;place-items:center;color:var(--ink)}
  .cap-cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-weight:800;font-size:13.5px}
  .cap-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:12px}
  .cap-cal-grid .cd{padding:6px 0;border-radius:8px;cursor:pointer}
  .cap-cal-grid .cd.dim{color:var(--ink-soft);opacity:.4}
  .cap-cal-grid .cd.today{font-weight:800;color:var(--sky-blue)}
  .cap-cal-grid .cd.sel{background:var(--sky-blue);color:#fff}
  .cap-cal-grid .wd{font-size:10.5px;color:var(--ink-soft);font-weight:700}
  .icon-panel{background:var(--card-2);border-bottom:1px solid var(--line);padding:10px 6px;max-height:34vh;overflow-y:auto}
  .icon-none{display:flex;align-items:center;gap:6px;border:0;background:none;color:var(--ink-soft);font-family:inherit;
    font-size:13px;font-weight:700;cursor:pointer;padding:4px}
  .icg-h{font-size:11.5px;font-weight:700;color:var(--ink-soft);margin:8px 4px 3px}
  .icg-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
  .icg-grid button{border:0;background:none;padding:8px;cursor:pointer;border-radius:10px}
  .icg-grid button:active{background:rgba(0,0,0,.06)}
  .icg-grid svg{width:22px;height:22px}
  .color-row{display:flex;gap:9px;overflow-x:auto;padding:8px 6px;background:var(--card-2);border-bottom:1px solid var(--line)}
  .color-row button{width:26px;height:26px;border-radius:50%;border:0;flex:0 0 auto;cursor:pointer;display:grid;place-items:center;color:#fff}

  /* ---------- mobile bottom bar ---------- */
  .mbar{display:none;flex:0 0 auto;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-top:1px solid rgba(0,0,0,.06);
    padding:7px 4px calc(9px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(20,40,80,.08);z-index:20}
  .mbtn{flex:1;border:none;background:transparent;font-family:inherit;cursor:pointer;padding:5px 2px;
    display:flex;flex-direction:column;align-items:center;gap:3px;color:#9aa3b2;font-size:10.5px;font-weight:600}
  .mbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .mbtn.on{color:var(--sky-blue)}.mbtn.on svg{stroke:var(--sky-blue)}

  /* ---------- responsive ---------- */
  @media(max-width:860px){
    .layout{display:block;position:relative;padding-bottom:64px}
    /* 하단 바를 뷰포트 바닥에 고정 (요청: 항상 보이게, 내부 스크롤·주소바 무관) */
    .mbar{position:fixed;left:0;right:0;bottom:0}
    .tabbody{padding-bottom:76px}
    .pane-tl .tl-body{padding-bottom:64px}
    .pane-tl,.pane-tabs{position:absolute;inset:0;max-width:none;flex:none;border-right:none;display:none}
    body[data-m="timeline"] .pane-tl{display:flex}
    body[data-m="todo"] .pane-tabs,body[data-m="matrix"] .pane-tabs,body[data-m="routine"] .pane-tabs,body[data-m="bucket"] .pane-tabs{display:flex}
    .tabrow{display:none}
    .mbar{display:flex}
  }

  /* day nav */
  .daynav{border:none;background:var(--card-2);color:var(--ink-soft);width:26px;height:26px;border-radius:8px;cursor:pointer;font-size:16px;line-height:1;flex:0 0 auto}
  .daynav:hover{background:#e9eef6;color:var(--ink)}

  /* matrix internal scroll: grid fills tabbody, rows sized by JS, cells scroll */
  .tabbody.matrix-mode{overflow:hidden}
  .tabbody.matrix-mode #view-matrix{display:flex;flex-direction:column;height:100%}
  .matrix.fit{flex:1;min-height:0}
  .matrix.fit .quad{min-height:0;overflow-y:auto}

  /* ---------- bucket ---------- */
  /* 물통 가운데 (요청): 세로 스택 + 중앙 정렬, 패널은 아래로. */
  .bucket-wrap{display:flex;flex-direction:column;gap:18px;align-items:center;overscroll-behavior:contain}
  .bucket-col{flex:0 0 auto;width:100%;max-width:480px}
  .bucket-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:2px}
  .bucket-nav button{border:0;background:transparent;font-size:22px;color:var(--ink-soft);cursor:pointer;padding:0 8px;line-height:1}
  .bucket-nav span{font-weight:800;font-size:15px;min-width:130px;text-align:center}
  .bcloud{position:absolute;top:0;right:0;display:flex;align-items:center;gap:6px;z-index:2;cursor:pointer}
  .rain-cloud{position:absolute;top:6px;left:50%;transform:translateX(-50%);font-size:64px;z-index:6;filter:drop-shadow(0 4px 10px rgba(0,0,0,.15));animation:hfCloudIn .4s ease-out}
  @keyframes hfCloudIn{from{opacity:0;transform:translateX(-50%) translateY(-14px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
  .rain-drop{position:absolute;top:78px;width:3px;height:15px;border-radius:2px;background:rgba(96,168,236,.85);z-index:5;opacity:0;animation:hfDrop 1s linear infinite}
  @keyframes hfDrop{0%{transform:translateY(0);opacity:0}12%{opacity:1}90%{opacity:.9}100%{transform:translateY(280px);opacity:0}}
  .bcloud-ico{font-size:26px}
  .bcloud-label{position:relative;overflow:hidden;font-size:11px;font-weight:700;color:var(--ink-soft);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 9px;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.06)}
  .bcloud-label .bfill{position:absolute;left:0;top:0;bottom:0;background:rgba(125,195,255,.5);transition:width 1.4s cubic-bezier(.4,0,.2,1)}
  .bcloud-label .btxt{position:relative;z-index:1}
  .bucket-scene{position:relative;width:460px;max-width:100%;height:480px;perspective:1250px;flex:0 0 auto;margin:6px auto 0;cursor:grab;touch-action:none;user-select:none}
  .bucket-scene:active{cursor:grabbing}
  .tub{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;transition:transform .3s cubic-bezier(.22,1,.36,1);will-change:transform}
  .tub>*{position:absolute;left:0;top:0}
  .wall{transition:background .18s}
  .wall.back .wlabel{opacity:0}
  .wlabel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:22px;pointer-events:none;color:#3a3f4c;text-shadow:0 1px 1px rgba(255,255,255,.4);transition:opacity .2s,color .2s}
  .wlabel .wn{font-weight:800;font-size:16px;letter-spacing:-.02em}
  .wlabel .ws{font-size:11px;font-weight:600;opacity:.72;margin-top:3px}
  .wlabel .wlv{position:absolute;top:12px;right:16px;font-size:12px;font-weight:800;opacity:.8}
  .cap{backface-visibility:visible}
  .bbadge{position:absolute;left:50%;top:2px;transform:translateX(-50%);color:#fff;font-weight:800;font-size:15px;padding:5px 13px;border-radius:999px;box-shadow:0 7px 16px rgba(0,0,0,.28);opacity:0;transition:opacity .3s}
  .bbadge.on{opacity:1}
  .bucket-info{width:100%;max-width:460px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px}
  .bi-top{display:flex;align-items:center;gap:9px}
  .bi-dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
  .bi-name{font-weight:800;font-size:16px}.bi-sub{font-size:12px;color:var(--ink-soft)}
  .bi-lv{margin-left:auto;color:#fff;font-weight:800;font-size:13px;padding:3px 11px;border-radius:999px}
  .bi-msg{margin-top:13px;font-size:14px;line-height:1.55}
  .bi-hint{margin-top:10px;font-size:12px;color:var(--ink-soft)}
  .bi-sides{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}
  .bi-side{display:flex;align-items:center;gap:9px;font-size:13px;cursor:pointer;padding:6px;border-radius:9px}
  .bi-side:hover{background:var(--card-2)}.bi-side.sel{background:var(--card-2);font-weight:600}
  .bi-side .nm{width:56px;flex:0 0 auto}
  .bi-side .bar{flex:1;height:8px;border-radius:5px;background:var(--line);overflow:hidden}
  .bi-side .fill{height:100%;border-radius:5px}
  .bi-side .v{width:38px;text-align:right;color:var(--ink-soft);font-variant-numeric:tabular-nums}

  /* ---------- login modal ---------- */
  .scrim{position:fixed;inset:0;z-index:30;background:rgba(15,20,40,.5);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding:0}
  .scrim.open{display:flex}
  .modal{position:relative;background:var(--card);border-radius:20px;padding:20px 16px 16px;
    width:calc(100% - 40px);max-width:320px;margin:calc(14px + env(safe-area-inset-top)) auto 0;
    max-height:80vh;overflow-y:auto;overflow-x:hidden;box-shadow:0 30px 70px rgba(0,0,0,.35);-webkit-overflow-scrolling:touch}
  .modal h3{font-size:20px}.modal .msub{color:var(--ink-soft);font-size:12.5px;margin:6px 0 15px}
  .modal input,.modal textarea,.modal select{width:100%;font-family:inherit;font-size:16px;padding:12px 13px;margin-bottom:9px;border:1px solid var(--line);border-radius:12px;background:var(--card-2);outline:none;box-sizing:border-box}
  .modal input:focus{border-color:var(--sky-blue)}
  .modal .go{width:100%;border:none;cursor:pointer;font-family:inherit;font-size:15px;font-weight:700;padding:13px;border-radius:12px;background:var(--ink);color:#fff;margin-top:5px}
  .modal .merr{color:#d5495f;font-size:12.5px;min-height:16px;margin:2px 0 3px}
  .modal .mswitch{text-align:center;font-size:12.5px;color:var(--ink-soft);margin-top:13px}
  .modal .mswitch a{color:var(--sky-blue);font-weight:600;cursor:pointer}
  .modal .mclose{position:sticky;float:right;top:0;margin:-6px -4px 0 0;width:30px;height:30px;border:none;
    background:var(--card-2);border-radius:50%;font-size:16px;color:var(--ink-soft);cursor:pointer;z-index:5;display:grid;place-items:center}
  /* 작업 편집 모달 (요청: 웹에서도 앱처럼 편집) */
  .modal.wide{max-width:320px}
  .elabel{font-size:11.5px;font-weight:700;color:var(--ink-soft);margin:12px 0 6px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-family:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--card-2);color:var(--ink-soft);border-radius:999px;padding:7px 12px;cursor:pointer}
  .chip.on{color:#fff;border-color:transparent}
  .erow{display:flex;gap:8px;align-items:center}
  .erow input[type=date],.erow input[type=time]{flex:1;margin-bottom:0}
  .ebtns{display:flex;gap:8px;margin-top:16px}
  .ebtns .go{margin-top:0;flex:1}
  .ebtns .del{flex:0 0 auto;white-space:nowrap;border:1px solid var(--line);background:var(--card-2);color:#d5495f;border-radius:12px;padding:11px 16px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer}
  .ebtns .play{flex:0 0 auto;min-width:84px;white-space:nowrap;border:0;background:var(--sky-blue);color:#fff;border-radius:12px;padding:11px 12px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer}
  .chip.ico{display:inline-flex;align-items:center;gap:5px}
  .chip.ico .ic{width:15px;height:15px}
  .etoggles{display:flex;gap:10px;margin-top:12px;font-size:13.5px;color:var(--ink)}
  .tpill{flex:1;display:flex;align-items:center;justify-content:space-between;cursor:pointer;
    border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:var(--card-2)}
  .tpill .tp-l{display:flex;align-items:center;gap:7px;font-weight:600}
  .tpill .ic{width:17px;height:17px;color:var(--ink-soft)}
  .tpill input{width:20px;height:20px;accent-color:var(--sky-blue)}
  .subrow{display:flex;align-items:center;gap:8px;padding:4px 0}
  .subck{width:20px;height:20px;flex:0 0 auto;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;cursor:pointer}
  .subck.on{background:var(--sky-blue);border-color:var(--sky-blue)}
  .subt{flex:1;font-size:13px}
  .subt.done{text-decoration:line-through;color:var(--ink-soft)}
  .subdel{border:0;background:transparent;color:var(--ink-soft);font-size:16px;cursor:pointer;opacity:.5}
  .subdel:hover{opacity:1;color:#e0564e}
  .stat-big{font-size:16px;margin-bottom:2px}.stat-big b{font-size:19px}
  .stat-prog{height:11px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px}
  .stat-prog>div{height:100%;background:var(--sky-blue);border-radius:6px}
  .stat-note{font-size:12px;color:var(--ink-soft);margin-top:8px}
  /* 집중 모드 (요청) */
  /* 포커스 페이지 — 앱과 같은 하늘 배경 + 타이머 링 (요청 첨부1) */

    var i=0;while(i<K.length-1&&h>K[i+1][0])i++;

    return [lerpHex(a[1],b[1],t),lerpHex(a[2],b[2],t),lerpHex(a[3],b[3],t)];
  }

  /* ---------- mosaic (last 7 days) ---------- */
  function renderMosaic(){
    var grid=document.getElementById('moGrid');grid.innerHTML='';
    var hours=[];for(var h=6;h<24;h++)hours.push(h);
    for(var off=0;off>=-6;off--){
      var d=new Date();d.setDate(d.getDate()+off);var key=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
      var slots={};
      (DATA.tasks||[]).forEach(function(t){
        if(!t.scheduledStart||!t.durationMin)return;if(dateKey(t.scheduledStart)!==key)return;
        var s=new Date(t.scheduledStart),sh=s.getHours(),eh=sh+Math.ceil(t.durationMin/60);
        for(var hh=sh;hh<eh;hh++)if(slots[hh]==null)slots[hh]=t.categoryID;
      });
      var lbl=off===0?'오늘':off===-1?'어제':(d.getMonth()+1)+'.'+d.getDate();
      var row=document.createElement('div');row.className='mo-row';
      var cells=hours.map(function(hh){var c=slots[hh];return '<div class="mo-cell" style="'+(c?'background:'+catColor(c):'')+'"></div>';}).join('');
      row.innerHTML='<span class="mo-day'+(off===0?' today':'')+'">'+lbl+'</span><div class="mo-track">'+cells+'</div>';
      grid.appendChild(row);
    }
    var used={};(DATA.tasks||[]).forEach(function(t){if(t.scheduledStart&&t.durationMin)used[t.categoryID]=1;});
    document.getElementById('moLegend').innerHTML=Object.keys(used).map(function(k){return '<span><i style="background:'+catColor(k)+'"></i>'+catName(k)+'</span>';}).join('');
  }

  function nextSlotToday(){
    var used=[];(DATA.tasks||[]).forEach(function(t){if(t.scheduledStart&&t.durationMin&&dateKey(t.scheduledStart)===todayKey()){var s=new Date(t.scheduledStart);used.push([s.getHours()+s.getMinutes()/60,t.durationMin/60]);}});
    used.sort(function(a,b){return a[0]-b[0];});
    var now=new Date();var t=Math.max(TS,Math.ceil((now.getHours()+now.getMinutes()/60)*2)/2);
    for(var i=0;i<used.length;i++){if(t+0.75<=used[i][0])break;if(t<used[i][0]+used[i][1])t=used[i][0]+used[i][1];}
    return Math.min(t,23);

  /* ---------- 작업 추가/삭제 (요청: 웹에서도 앱 기능) ---------- */

      :'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0,v=c==='x'?r:(r&0x3|0x8);return v.toString(16);});
    return u.toUpperCase();  // Swift UUID 관례
  }

  /* ---------- 루틴(습관) 추가/체크/연속 (요청: 웹 이식) ---------- */
  function habitKey(d){d=d||new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
  function habitLog(h){try{return JSON.parse(h.logJSON||'{}');}catch(e){return {};}}
  function habitDayOn(h,wd){return (h.weekdaysMask===0||h.weekdaysMask===127)?true:((h.weekdaysMask&(1<<wd))!==0);} // wd: 0=일..6=토
  function newHabit(o){return Object.assign({
    id:uuid(),title:'',categoryID:'study',isAvoid:false,iconName:null,weekdaysMask:127,
    createdAt:new Date().toISOString(),logJSON:'{}',photosJSON:'[]',scheduleKindRaw:'everyday',
    intervalDays:2,intervalFromLastCheck:false,dayEndMinutes:0,reminderMinutesJSON:'[]',startDate:null,endDate:null
  },o||{});}
  function addHabit(o){if(!DATA.habits)DATA.habits=[];var h=newHabit(o);DATA.habits.push(h);renderRoutine();pushSnapshot();return h;}
  function deleteHabit(h){DATA.habits=(DATA.habits||[]).filter(function(x){return x!==h;});renderRoutine();pushSnapshot();}
  function toggleHabitToday(h){var log=habitLog(h),k=habitKey();if(log[k]===1)delete log[k];else log[k]=1;h.logJSON=JSON.stringify(log);renderRoutine();pushSnapshot();}
  function toggleHabitDay(h,wd){var m=(h.weekdaysMask===0||h.weekdaysMask===127)?127:h.weekdaysMask;h.weekdaysMask=m^(1<<wd);renderRoutine();pushSnapshot();}
  // 연속(streak): 예정일만 세고, 성공(1)이 끊길 때까지. 오늘 미체크는 안 깨짐 (앱 규칙).
  function habitStreak(h){var log=habitLog(h),count=0,day=new Date();day.setHours(0,0,0,0);var first=true;
    for(var i=0;i<730;i++){
      if(habitDayOn(h,day.getDay())){var raw=log[habitKey(day)]||0;
        if(raw===1)count++; else if(first){if(raw!==0)break;} else break;}
      first=false;day.setDate(day.getDate()-1);
    }return count;}
  function doHabitAdd(){var el=document.getElementById('habitAdd');var v=(el.value||'').trim();if(!v)return;addHabit({title:v});el.value='';}
  // 타임라인 블록 드래그로 이동 (요청): 세로로 끌면 시작 시각이 5분 단위로 바뀜.
  // 움직이지 않으면 클릭 → 편집 모달. 양방향 sync.
  function dragBlock(el,t){
    var sy=0,moved=false,base=null,pending=null;
    el.addEventListener('pointerdown',function(e){
      base=new Date(t.scheduledStart);sy=e.clientY;moved=false;pending=null;
      try{el.setPointerCapture(e.pointerId);}catch(_){}
    });
    el.addEventListener('pointermove',function(e){
      if(base==null)return;var dy=e.clientY-sy;if(Math.abs(dy)>4){moved=true;el.style.cursor='grabbing';}
      if(moved){var nd=new Date(base.getTime()+(dy/PPH)*3600000);var mm=Math.round(nd.getMinutes()/5)*5;nd.setMinutes(mm,0,0);
        pending=nd;el.style.top=yFor(nd.getHours()+nd.getMinutes()/60)+'px';}
    });
    function done(){if(base==null)return;el.style.cursor='grab';
      if(moved&&pending){t.scheduledStart=pending.toISOString();base=null;renderBig();renderMosaic();pushSnapshot();}
      else{base=null;openEditor(t);}}
    el.addEventListener('pointerup',done);
    el.addEventListener('pointercancel',function(){base=null;el.style.cursor='grab';});
  }
  // 타임라인 블록 아래끝 드래그로 길이(분) 조절 (요청): 5분 스냅, 양방향 sync.
  function resizeBlock(handle,el,t){
    var sy=0,baseDur=0,active=false,pending=0;
    handle.addEventListener('pointerdown',function(e){e.stopPropagation();sy=e.clientY;baseDur=t.durationMin||50;active=true;pending=baseDur;try{handle.setPointerCapture(e.pointerId);}catch(_){}});
    handle.addEventListener('pointermove',function(e){if(!active)return;e.stopPropagation();
      var dMin=Math.round(((e.clientY-sy)/PPH*60)/5)*5;pending=Math.max(5,baseDur+dMin);
      el.style.height=Math.max(28,(pending/60)*PPH-6)+'px';el.querySelector('small').textContent=pending+'m';});
    handle.addEventListener('pointerup',function(e){if(!active)return;e.stopPropagation();active=false;if(pending&&pending!==baseDur){t.durationMin=pending;renderBig();renderMosaic();pushSnapshot();}});
  }

  // Math.random 회피용(워크플로 재현성 무관, 웹은 그냥 Math.random 사용).

  // 보상 지급 (요청): 완료 시 한 번만. 돈이면 물통에 쌓고, 이름이면 Q4에 담고 축하.

    editTask.notes=document.getElementById('eNote').value||'';
    // 보상 저장 (요청).
    var rt=(document.getElementById('eRewardText').value||'').trim();
    if(eRewardIsMoney){editTask.rewardMoney=parseInt(rt.replace(/[^0-9]/g,''),10)||0;editTask.rewardText='';editTask.rewardToQ4=false;}
    else{editTask.rewardText=rt;editTask.rewardMoney=0;editTask.rewardToQ4=document.getElementById('eRewardQ4').checked&&!!rt;}
    // 시간만 입력 → 오늘(보고 있는 날짜) 그 시각에 배치, 비우면 배치 해제 (요청).
    var tv=document.getElementById('eTime').value;
    if(tv){var bd=new Date(calSel);var hm=tv.split(':');bd.setHours(+hm[0],+hm[1],0,0);
      editTask.scheduledStart=bd.toISOString();if(!editTask.durationMin)editTask.durationMin=50;}
    else{editTask.scheduledStart=null;}
    closeEditor();renderAll();pushSnapshot();
  }

  /* ---------- 집중 모드 (요청) ---------- */
  var fTask=null,fStart=0,fPausedAcc=0,fPauseAt=0,fPaused=false,fTimer=null;
  function fmtMS(s){var m=Math.floor(s/60);return ('0'+m).slice(-2)+':'+('0'+(s%60)).slice(-2);}
  function focusElapsed(){var base=fPaused?fPauseAt:Date.now();return Math.max(0,Math.floor((base-fStart-fPausedAcc)/1000));}
  /* ---------- Focus music (요청: 앱의 집중 사운드 이식) ----------
     원본 음원(각 35~64MB)은 웹에 못 싣는다 — WebAudio로 같은 씬(비·파도·
     장작불·비행)을 합성한다: 용량 0, 즉시 재생, 완벽 루프. */
  var fmCtx=null,fmNodes=[],fmTimer=null;
  function fmScene(){return localStorage.getItem('hfScene')||'none';}
  function fmStop(){if(fmTimer){clearTimeout(fmTimer);fmTimer=null;}
    fmNodes.forEach(function(n){try{n.stop&&n.stop();}catch(e){}});fmNodes=[];
    if(fmCtx){try{fmCtx.close();}catch(e){}fmCtx=null;}}
  function fmBuf(ctx,sec,brown){var b=ctx.createBuffer(1,ctx.sampleRate*sec,ctx.sampleRate),d=b.getChannelData(0),last=0;
    for(var i=0;i<d.length;i++){var w=Math.random()*2-1;
      if(brown){last=(last+0.02*w)/1.02;d[i]=last*3.5;}else d[i]=w;}return b;}
  function fmStart(id){
    fmStop();localStorage.setItem('hfScene',id);paintFm();
    if(id==='none')return;
    var C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    fmCtx=new C();var ctx=fmCtx,out=ctx.createGain();out.gain.value=0.5;out.connect(ctx.destination);
    function src(buf){var x=ctx.createBufferSource();x.buffer=buf;x.loop=true;return x;}
    if(id==='rain'){var s1=src(fmBuf(ctx,2,false)),f=ctx.createBiquadFilter(),f2=ctx.createBiquadFilter();
      f.type='bandpass';f.frequency.value=2300;f.Q.value=0.55;f2.type='lowpass';f2.frequency.value=6500;
      s1.connect(f);f.connect(f2);f2.connect(out);s1.start();fmNodes.push(s1);}
    else if(id==='waves'){var s2=src(fmBuf(ctx,4,true)),lp=ctx.createBiquadFilter(),g=ctx.createGain(),lfo=ctx.createOscillator(),la=ctx.createGain();
      lp.type='lowpass';lp.frequency.value=520;g.gain.value=0.45;lfo.frequency.value=0.085;la.gain.value=0.33;
      lfo.connect(la);la.connect(g.gain);s2.connect(lp);lp.connect(g);g.connect(out);s2.start();lfo.start();fmNodes.push(s2,lfo);}
    else if(id==='fire'){var s3=src(fmBuf(ctx,3,true)),lp3=ctx.createBiquadFilter();
      lp3.type='lowpass';lp3.frequency.value=330;s3.connect(lp3);lp3.connect(out);s3.start();fmNodes.push(s3);
      var s4=src(fmBuf(ctx,2,false)),hp=ctx.createBiquadFilter(),cg=ctx.createGain();
      hp.type='highpass';hp.frequency.value=2600;cg.gain.value=0;s4.connect(hp);hp.connect(cg);cg.connect(out);s4.start();fmNodes.push(s4);
      (function crack(){if(!fmCtx||fmScene()!=='fire')return;var t=fmCtx.currentTime;
        cg.gain.setValueAtTime(0,t);cg.gain.linearRampToValueAtTime(0.18+Math.random()*0.5,t+0.008);
        cg.gain.exponentialRampToValueAtTime(0.001,t+0.05+Math.random()*0.08);
        fmTimer=setTimeout(crack,120+Math.random()*550);})();}
    else if(id==='plane'){var s5=src(fmBuf(ctx,4,true)),lp5=ctx.createBiquadFilter(),g5=ctx.createGain();
      lp5.type='lowpass';lp5.frequency.value=240;g5.gain.value=0.95;
      s5.connect(lp5);lp5.connect(g5);g5.connect(out);s5.start();fmNodes.push(s5);}
  }
  var FM_LIST=[['rain','비'],['waves','파도'],['fire','장작불'],['plane','비행'],['none','없음']];
  function paintFm(){
    var wrap=document.getElementById('fmChips');if(!wrap)return;
    wrap.innerHTML=FM_LIST.map(function(p){return '<button class="fm-chip'+(fmScene()===p[0]?' on':'')+'" data-s="'+p[0]+'">'+IC[p[0]]+' '+p[1]+'</button>';}).join('');
    wrap.querySelectorAll('.fm-chip').forEach(function(el){el.addEventListener('click',function(){
      fmStart(el.dataset.s);wrap.style.display='none';});});
  }

  // 포모도로 (앱 파리티): 켜면 25·5 리듬, 실시간(0분)도 25분 카운트다운.
  function pomoOn(){return localStorage.getItem('hfPomo')==='1';}
  function focusPhase(el){
    if(pomoOn()){var p=el%1800;return p<1500?{total:1500,left:1500-p,rest:false,countdown:true}:{total:300,left:1800-p,rest:true,countdown:true};}
    var plan=(fTask.durationMin||0)*60;
    if(plan>0&&el<plan)return{total:plan,left:plan-el,rest:false,countdown:true};
    return{total:3600,left:0,rest:false,countdown:false};   // 딥포커스: 한 바퀴 = 60분 (앱 파리티)
  }
  var ftKey='';
  // 앱 타이머 링 (요청 첨부1): 눈금 + 분 라벨 + 진행 아크 + 노브.
  function buildRing(total,color,countdown){
    var svg=document.getElementById('ftRing');if(!svg)return;
    var mins=Math.max(1,Math.round(total/60)),cx=160,cy=160,html='';
    var n=Math.min(60,mins),labEvery=mins<=30?5:10;
    for(var k=0;k<n;k++){var frac=k/n,a=frac*2*Math.PI-Math.PI/2;
      var mv=Math.round(frac*mins),major=(mv%labEvery===0);
      var r1=major?130:134,r2=140;
      html+='<line class="ftick" x1="'+(cx+Math.cos(a)*r1).toFixed(1)+'" y1="'+(cy+Math.sin(a)*r1).toFixed(1)+'" x2="'+(cx+Math.cos(a)*r2).toFixed(1)+'" y2="'+(cy+Math.sin(a)*r2).toFixed(1)+'" stroke-width="'+(major?2:1)+'"/>';
      if(major){var lr=152;html+='<text class="ftlabel" x="'+(cx+Math.cos(a)*lr).toFixed(1)+'" y="'+(cy+Math.sin(a)*lr+4.5).toFixed(1)+'" text-anchor="middle">'+mv+'</text>';}
    }
    html+='<circle cx="160" cy="160" r="118" fill="none" stroke="'+hexA(color,countdown?0.28:0.16)+'" stroke-width="13"/>';
    html+='<circle id="ftArc" cx="160" cy="160" r="118" fill="none" stroke="'+color+'" stroke-width="13" stroke-linecap="round" transform="rotate(-90 160 160)"/>';
    html+='<g id="ftKnob"><circle cx="160" cy="42" r="10" fill="'+color+'" stroke="#fff" stroke-width="3.5"/></g>';
    svg.innerHTML=html;
  }
  function tickFocus(){
    if(!fTask)return;var el=focusElapsed(),ph=focusPhase(el);
    var col=ph.rest?'#6BC1F9':catColor(fTask.categoryID);
    var key=ph.total+'|'+col+'|'+ph.countdown;
    if(key!==ftKey){ftKey=key;buildRing(ph.total,col,ph.countdown);}
    var prog=ph.countdown?1-(ph.left/ph.total):((el%3600)/3600);
    var C=2*Math.PI*118,arc=document.getElementById('ftArc');
    if(arc){if(ph.countdown){arc.setAttribute('stroke-dasharray',((1-prog)*C)+' '+C);arc.setAttribute('stroke-dashoffset',String(-prog*C));}
      else{arc.setAttribute('stroke-dasharray',(Math.max(0.001,prog)*C)+' '+C);arc.setAttribute('stroke-dashoffset','0');}}
    var kn=document.getElementById('ftKnob');if(kn)kn.setAttribute('transform','rotate('+(prog*360)+' 160 160)');
    document.getElementById('ftTimer').textContent=fmtMS(ph.countdown?ph.left:el);
    document.getElementById('ftSub').textContent=ph.rest?'쉬는 시간 — 잠깐 쉬어가요':(fPaused?'일시정지 중':'');
  }
  function paintPomoChip(){var b=document.getElementById('ftPomo');if(b){b.classList.toggle('on',pomoOn());b.innerHTML=IC.timer+(pomoOn()?' 포모도로 켜짐':' 포모도로');}}
  function startFocus(t){closeEditor();fTask=t;fStart=Date.now();fPausedAcc=0;fPauseAt=0;fPaused=false;ftKey='';
    document.getElementById('ftTitle').innerHTML='<span style="opacity:.9">○</span> '+catIcon(t.categoryID)+' '+esc(t.title||'집중');
    // 오늘 통계 (앱 파리티): ⏳ 오늘 N분 · ✨ n번째 집중.
    var mins=0,cnt=0;(DATA.sessions||[]).forEach(function(x){if(dateKey(x.start)===todayKey()){mins+=Math.floor((x.focusedSec||0)/60);cnt++;}});
    document.getElementById('ftStats').textContent='⏳ 오늘 '+mins+'분 · '+(cnt===0?'✨ 첫 집중':'✨ '+(cnt+1)+'번째 집중');
    var h=new Date().getHours();
    document.getElementById('focusScrim').classList.toggle('night',h<6||h>=18);
    document.getElementById('ftPause').innerHTML=IC.pause;paintPomoChip();paintFm();
    if(fmScene()!=='none')fmStart(fmScene());   // 저장된 focus music 이어서 (클릭 제스처라 자동재생 허용)
    document.getElementById('focusScrim').classList.add('open');tickFocus();fTimer=setInterval(tickFocus,250);}
  function togglePauseFocus(){if(fPaused){fPausedAcc+=Date.now()-fPauseAt;fPaused=false;document.getElementById('ftPause').innerHTML=IC.pause;if(fmCtx)fmCtx.resume();}
    else{fPauseAt=Date.now();fPaused=true;document.getElementById('ftPause').innerHTML=IC.play;if(fmCtx)fmCtx.suspend();}}
  function finishFocus(){if(!fTask)return;clearInterval(fTimer);var el=focusElapsed();
    fTask.actualFocusedSec=(fTask.actualFocusedSec||0)+el;fTask.cumulativeFocusedSec=(fTask.cumulativeFocusedSec||0)+el;fTask.lastFocusedAt=new Date().toISOString();
    if(!fTask.durationMin){var mins=Math.max(1,Math.round(el/60));fTask.durationMin=mins;fTask.scheduledStart=new Date(Date.now()-mins*60000).toISOString();}
    // 세션 기록 (요청: 물통·통계·동기화에 반영되도록 앱과 같은 FocusSession).
    if(el>=5){if(!DATA.sessions)DATA.sessions=[];DATA.sessions.push({id:uuid(),taskID:fTask.id,taskTitle:fTask.title||'',categoryID:fTask.categoryID||'focus',start:new Date(fStart).toISOString(),end:new Date().toISOString(),focusedSec:el});}
    document.getElementById('focusScrim').classList.remove('open');fTask=null;fmStop();renderAll();pushSnapshot();}

  /* ---------- 설정 (요청: 웹 이식) ---------- */
  function minToHHMM(m){m=((m%1440)+1440)%1440;return ('0'+Math.floor(m/60)).slice(-2)+':'+('0'+(m%60)).slice(-2);}
  function hhmmToMin(v){var p=(v||'').split(':');return p.length===2?(+p[0]*60+ +p[1]):0;}
  function openSettings(){var s=DATA.settings||{};
    document.getElementById('setGoal').value=s.focusGoalMinutes!=null?s.focusGoalMinutes:240;
    document.getElementById('setWake').value=minToHHMM(s.wakeMinutes!=null?s.wakeMinutes:420);
    document.getElementById('setBed').value=minToHHMM(s.bedMinutes!=null?s.bedMinutes:1380);
    document.getElementById('settingsScrim').classList.add('open');}
  function saveSettings(){if(!DATA.settings)DATA.settings={};
    DATA.settings.focusGoalMinutes=parseInt(document.getElementById('setGoal').value,10)||0;
    DATA.settings.wakeMinutes=hhmmToMin(document.getElementById('setWake').value);
    DATA.settings.bedMinutes=hhmmToMin(document.getElementById('setBed').value);
    document.getElementById('settingsScrim').classList.remove('open');renderAll();pushSnapshot();}

  /* ---------- 통계 (요청: 웹 이식) ---------- */
  function focusStats(){
    var ss=allSessions();
    if(ss.length){var cutoff=new Date();cutoff.setDate(cutoff.getDate()-6);cutoff.setHours(0,0,0,0);
      var byCat={},total=0,today=0,tk=todayKey();
      ss.forEach(function(s){var d=new Date(s.start),sec=s.focusedSec||0;
        if(d>=cutoff){byCat[s.categoryID]=(byCat[s.categoryID]||0)+sec;total+=sec;}
        if(dateKey(s.start)===tk)today+=sec;});
      return {byCat:byCat,total:total,today:today,demo:false};}
    // 세션 없으면(DEMO/미로그인) 작업 누적 집중으로 근사.
    var byCat={},total=0;(DATA.tasks||[]).forEach(function(t){var sec=t.actualFocusedSec||0;if(sec){byCat[t.categoryID]=(byCat[t.categoryID]||0)+sec;total+=sec;}});
    return {byCat:byCat,total:total,today:0,demo:true};
  }
  function hm(sec){var h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60);return (h>0?h+'시간 ':'')+m+'분';}
  function openStats(){
    var st=focusStats(),goal=((DATA.settings&&DATA.settings.focusGoalMinutes)||240)*60;
    var maxCat=Math.max(1,Object.keys(st.byCat).reduce(function(m,k){return Math.max(m,st.byCat[k]);},0));
    var streak=(DATA.habits||[]).reduce(function(m,h){return Math.max(m,habitStreak(h));},0);
    var bars=Object.keys(st.byCat).sort(function(a,b){return st.byCat[b]-st.byCat[a];}).map(function(k){
      return '<div class="bi-side"><span class="nm">'+esc(catName(k))+'</span><div class="bar"><div class="fill" style="width:'+Math.round(st.byCat[k]/maxCat*100)+'%;background:'+catColor(k)+'"></div></div><span class="v">'+hm(st.byCat[k])+'</span></div>';}).join('')
      ||'<div class="stat-note">아직 집중 기록이 없어요.</div>';
    var body=document.getElementById('statsBody');
    body.innerHTML=
      '<div class="stat-big">'+(st.demo?'누적':'지난 7일')+' · <b>'+hm(st.total)+'</b> 집중</div>'+
      '<div class="elabel">카테고리별</div><div class="bi-sides">'+bars+'</div>'+
      (st.demo?'':'<div class="elabel">오늘 · 목표</div><div>'+hm(st.today)+' / '+hm(goal)+'</div><div class="stat-prog"><div style="width:'+Math.min(100,Math.round(st.today/Math.max(1,goal)*100))+'%"></div></div>')+
      '<div class="elabel">최고 연속</div><div class="stat-big">🔥 '+streak+'일</div>'+
      (st.demo?'<div class="stat-note">로그인하면 날짜별 집중 세션 통계가 보여요.</div>':'');
    document.getElementById('statsScrim').classList.add('open');
  }

  // 작업 막대 좌우 스와이프 → 뒤에 숨은 액션 버튼 노출 (요청: 폰).
  var swipeOpen=null;
  function closeSwipe(){
    if(!swipeOpen)return;var innerEl=swipeOpen,rowEl=innerEl.closest('.task');
    innerEl.style.transition='transform .2s cubic-bezier(.3,0,.2,1)';innerEl.style.transform='translateX(0)';
    if(rowEl)rowEl.classList.remove('sw-left','sw-right','mx-open');swipeOpen=null;}
  function attachSwipe(row,t,placed){
    var inner=row.querySelector('.task-inner'),sx=0,sy=0,cur=0,startCur=0,drag=false,lock='';
    var LW=128,RW=128;   // 오른쪽 스와이프(내일로+매트릭스) · 왼쪽 스와이프(타임라인+삭제)
    function set(x){cur=x;inner.style.transform='translateX('+x+'px)';
      row.classList.toggle('sw-left',x>6);row.classList.toggle('sw-right',x<-6);}
    inner.addEventListener('pointerdown',function(e){if(e.pointerType==='mouse')return;
      if(swipeOpen&&swipeOpen!==inner)closeSwipe();
      sx=e.clientX;sy=e.clientY;startCur=cur;drag=true;lock='';inner.style.transition='none';});
    inner.addEventListener('pointermove',function(e){if(!drag)return;
      var dx=e.clientX-sx,dy=e.clientY-sy;
      if(!lock){if(Math.abs(dx)<6&&Math.abs(dy)<6)return;lock=Math.abs(dx)>Math.abs(dy)?'x':'y';}
      if(lock!=='x')return;e.preventDefault();
      // 손 움직임 1:1 추종 (startCur 기준). 오버슈트 없이 딱 버튼 폭까지만.
      set(Math.max(-RW,Math.min(LW,startCur+dx)));});
    function end(){if(!drag)return;drag=false;inner.style.transition='transform .22s cubic-bezier(.3,0,.2,1)';
      if(cur>LW*0.4){set(LW);swipeOpen=inner;}
      else if(cur<-RW*0.4){set(-RW);swipeOpen=inner;}
      else{set(0);if(swipeOpen===inner)swipeOpen=null;}}
    inner.addEventListener('pointerup',end);inner.addEventListener('pointercancel',end);
    // 4버튼 탭
    row.querySelector('.sa-tomorrow').addEventListener('click',function(){
      var d=new Date();d.setDate(d.getDate()+1);d.setHours(0,0,0,0);
      t.deferredUntil=d.toISOString();t.deferCount=(t.deferCount||0)+1;
      closeSwipe();renderTodo();pushSnapshot();});
    row.querySelector('.sa-matrix').addEventListener('click',function(){
      showMxPick(row,t);});
    row.querySelector('.sa-timeline').addEventListener('click',function(){
      var slot=nextSlotToday();t.scheduledStart=todayAt(Math.floor(slot),(slot%1)*60);if(!t.durationMin)t.durationMin=50;
      closeSwipe();renderTodo();renderBig();renderMosaic();pushSnapshot();});
    row.querySelector('.sa-delete').addEventListener('click',function(){deleteTask(t);});
  }
  // 매트릭스 버튼 → 행이 4등분 사분면 선택지로 (앱 파리티, 요청).
  function showMxPick(row,t){
    var pick=row.querySelector('.mx-pick');
    var QS=[[1,'중요·긴급','#EF6461'],[2,'중요·여유','#4585D6'],[3,'긴급·사소','#F0863D'],[4,'사소·여유','#9A5BD8']];
    pick.innerHTML=QS.map(function(q){return '<button data-q="'+q[0]+'" style="background:'+q[2]+'">'+q[1]+'</button>';}).join('');
    row.classList.add('mx-open');

      t.matrixQuadrant=+b.dataset.q;row.classList.remove('mx-open');closeSwipe();renderAll();pushSnapshot();});});
  }

  // 할일 한 줄 (스와이프 4버튼 포함) — 여러 섹션이 공유한다 (요청 리팩터).
  function buildTodoRow(t){
    var placed=t.scheduledStart&&t.durationMin;
    var row=document.createElement('div');row.className='task'+(t.isDone?' done':'');
    row.innerHTML=
      '<div class="swipe-grp lead">'+
        '<button class="sa sa-tomorrow">'+IC.curve+'<b>내일로</b></button>'+
        '<button class="sa sa-matrix">'+IC.grid+'<b>매트릭스</b></button></div>'+
      '<div class="swipe-grp trail">'+
        '<button class="sa sa-timeline">'+IC.sunrise+'<b>타임라인</b></button>'+
        '<button class="sa sa-delete">'+IC.trash+'<b>삭제</b></button></div>'+
      '<div class="mx-pick"></div>'+
      '<div class="task-inner">'+
        '<span class="check'+(t.isDone?' done':'')+'"></span>'+
        '<span class="swatch" style="background:'+catColor(t.categoryID)+'"></span>'+
        '<div class="t-main"><div class="t-title">'+esc(t.title)+'</div>'+
          '<div class="t-meta">'+(placed?'<span class="t-time">'+fmtTime(t.scheduledStart)+'</span>':'')+taskMetaHTML(t)+'</div></div>'+
        memoIconHTML(t)+
        '<span class="star'+(t.isStarred?' on':'')+'">'+(t.isStarred?'★':'☆')+'</span>'+
        '<button class="play" title="집중 시작">'+IC.play+'</button>'+
      '</div>';
    var tl=row.querySelector('.t-title');tl.style.cursor='pointer';tl.addEventListener('click',function(){openEditor(t);});
    row.querySelector('.play').addEventListener('click',function(){startFocus(t);});
    var mi=row.querySelector('.t-memo');if(mi)mi.addEventListener('click',function(e){e.stopPropagation();openMemoPopup(t);});
    row.querySelector('.check').addEventListener('click',function(){t.isDone=!t.isDone;t.completedAt=t.isDone?new Date().toISOString():null;if(t.isDone)grantReward(t);renderTodo();pushSnapshot();});
    row.querySelector('.star').addEventListener('click',function(){t.isStarred=!t.isStarred;renderTodo();pushSnapshot();});
    attachSwipe(row,t,!!placed);

  }
  function renderTodo(){
    var dow=document.getElementById('todoDow');
    if(dow)dow.textContent=calSel.toLocaleDateString('en-US',{weekday:'short'});
    var list=document.getElementById('todoList');list.innerHTML='';
    var todayMid=new Date();todayMid.setHours(0,0,0,0);
    // 내일로 미룬 일은 그날이 되기 전엔 숨긴다 (앱 파리티, 요청).
    var visible=(DATA.tasks||[]).filter(function(t){
      if(!t.deferredUntil)return true;return new Date(t.deferredUntil)<=todayMid;});
    // 선택 날짜에 배치된 일정 (캘린더 스트립과 연동, 요청).
    var scheduled=visible.filter(function(t){return t.scheduledStart&&calSameDay(new Date(t.scheduledStart),calSel);})
      .sort(function(a,b){return new Date(a.scheduledStart)-new Date(b.scheduledStart);});
    // 담아둔 일: 배치 안 됐고 완료 안 된 것 (별표 우선).
    var backlog=visible.filter(function(t){return !t.scheduledStart&&!t.isDone;})
      .sort(function(a,b){return (b.isStarred?1:0)-(a.isStarred?1:0);});
    if(!scheduled.length&&!backlog.length){list.innerHTML='<div class="empty" style="color:#fff;text-shadow:0 1px 2px rgba(20,40,80,.4)">할 일이 없어요.</div>';return;}

    if(backlog.length){
      list.insertAdjacentHTML('beforeend','<div class="sec-h">담아둔 일 '+backlog.length+'</div>');

    }
  }

  /* ---------- bucket (7기둥 물통; 날짜별 집중=물이 차오름, 요청) ---------- */

  ];
  var bSel=-1,bucketDay=0,tubBuilt=false,bView=0,bManual={},bIntroTimer=null;
  var TUB={N:7,R:142,H:232};TUB.a=TUB.R*Math.cos(Math.PI/TUB.N);TUB.s=2*TUB.R*Math.sin(Math.PI/TUB.N);TUB.step=360/TUB.N;
  TUB.wood=0.14;                 // 아래 나무 바닥 비율(높이 0 지점)
  TUB.waterMax=TUB.H*(1-TUB.wood-0.04);  // 물이 찰 수 있는 최대 높이
  function bucketDate(){var d=new Date();d.setDate(d.getDate()+bucketDay);d.setHours(0,0,0,0);return d;}
  function allSessions(){return (DATA.sessions&&DATA.sessions.length)?DATA.sessions:((serverSnap&&serverSnap.sessions)||[]);}
  function bucketSessions(){var d=bucketDate(),k=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
    return allSessions().filter(function(s){var sd=new Date(s.start);return sd.getFullYear()+'-'+(sd.getMonth()+1)+'-'+sd.getDate()===k;});}
  function sameDayISO(iso,d){var s=new Date(iso);return s.getFullYear()===d.getFullYear()&&s.getMonth()===d.getMonth()&&s.getDate()===d.getDate();}
  // 그날 카테고리별 집중 → 물 높이(0~10). 앱과 동일 공식: focusSec/1800*1.5 +
  // 그날 완료한 작업수*1.5. 세션·완료가 전혀 없으면(DEMO) 오늘만 하드코딩.
  function sideLevel(id){
    if(bManual[id]!=null)return bManual[id];   // 마우스로 내린 수동 조절 (요청)
    var d=bucketDate(),ss=allSessions();
    var secs=ss.length?bucketSessions().filter(function(s){return s.categoryID===id;}).reduce(function(a,s){return a+(s.focusedSec||0);},0):0;
    var doneTasks=(DATA.tasks||[]).filter(function(t){return t.categoryID===id&&t.isDone&&t.completedAt&&sameDayISO(t.completedAt,d);}).length;
    var lv=secs/1800*1.5+doneTasks*1.5;
    if(!ss.length&&lv===0){var sd=SIDES.filter(function(x){return x.id===id;})[0];if(bucketDay===0&&sd)lv=sd.demo;}
    return Math.max(0,Math.min(10,Math.round(lv*10)/10));
  }
  function bucketDaySec(){
    if(!allSessions().length)return bucketDay===0?SIDES.reduce(function(a,x){return a+Math.round(x.demo/1.5*1800);},0):0;
    return bucketSessions().reduce(function(a,s){return a+(s.focusedSec||0);},0);

  function box(w,h){var e=document.createElement('div');e.style.width=w+'px';e.style.height=h+'px';e.style.marginLeft=(-w/2)+'px';e.style.marginTop=(-h/2)+'px';return e;}
  function buildTub(){
    var tub=document.getElementById('tub');if(!tub)return;tub.innerHTML='';
    var N=TUB.N,R=TUB.R,H=TUB.H,a=TUB.a,s=TUB.s,step=TUB.step,woodPx=TUB.wood*H;
    // 나무 바닥 캡 — 꼭짓점을 옆면 경계에 맞춰 정렬 (요청: 아랫면 rotate로 맞춤).
    var pts=[];for(var j=0;j<N;j++){var dd=((j+0.5)*step)*Math.PI/180;pts.push((50+50*Math.sin(dd)).toFixed(2)+'% '+(50+50*Math.cos(dd)).toFixed(2)+'%');}
    var fl=box(2*R,2*R);fl.className='cap';fl.style.background='repeating-linear-gradient(46deg,#d9b477,#d9b477 15px,#c9a25c 15px,#c9a25c 30px)';fl.style.clipPath='polygon('+pts.join(',')+')';fl.style.transform='translateY('+(H/2-woodPx)+'px) rotateX(90deg)';tub.appendChild(fl);

    wp.style.background='radial-gradient(circle at 50% 42%,rgba(150,205,255,.92),rgba(80,155,235,.88))';
    wp.style.transform='translateY('+(H/2-woodPx)+'px) rotateX(90deg)';

    SIDES.forEach(function(side,i){
      var col=catColor(side.id),wall=box(s,H);wall.className='wall';wall.dataset.i=i;
      // 뼈대(테두리) 없이 단단한 옆면 재질 (요청): 프로스트 판 + 안쪽 음영.
      wall.style.border='none';

      // 물만 (요청: 연한 바탕색 제거). 처음 0 → 그날 집중량으로 차오름.

      var lab=document.createElement('div');lab.className='wlabel';
      lab.innerHTML='<div class="wn">'+esc(side.name)+'</div><div class="ws">'+esc(side.sub)+'</div><div class="wlv"></div>';
      wall.appendChild(lab);

  function updateWater(){

  function setupBucketDrag(){
    var scene=document.querySelector('.bucket-scene');if(!scene||scene._dragSet)return;scene._dragSet=true;
    var sx=0,sy=0,down=false,moved=false,wallEl=null,startView=0,startLv=0;
    scene.addEventListener('pointerdown',function(e){
      down=true;moved=false;sx=e.clientX;sy=e.clientY;startView=bView;
      wallEl=e.target.closest('.wall');
      if(wallEl)startLv=sideLevel(SIDES[+wallEl.dataset.i].id);
      try{scene.setPointerCapture(e.pointerId);}catch(_){}
    });
    // 드래그 중 페이지 스크롤 방지 (요청): touch-action:none + touchmove 차단.
    scene.addEventListener('touchmove',function(e){if(down&&e.cancelable)e.preventDefault();},{passive:false});
    scene.addEventListener('pointermove',function(e){
      if(!down)return;if(e.cancelable)e.preventDefault();var dx=e.clientX-sx,dy=e.clientY-sy;
      if(Math.abs(dx)>3||Math.abs(dy)>3)moved=true;
      if(wallEl && +wallEl.dataset.i===bSel && Math.abs(dy)>Math.abs(dx)){

      }
    });
    function end(){down=false;tubNoTransition(false);if(!moved&&wallEl)selectSide(+wallEl.dataset.i);}

  var bRaining=false;

  function rainBucket(){
    if(bRaining)return;var scene=document.querySelector('.bucket-scene'),tub=document.getElementById('tub');
    if(!scene||!tub)return;bRaining=true;
    var sec=bucketDaySec(),rained=+localStorage.getItem(rainedKey())||0;

    var cl=document.createElement('div');cl.className='rain-cloud';cl.textContent='☁️';scene.appendChild(cl);
    var drops=[],n=Math.max(4,Math.min(18,Math.round(mins/8)+4));   // 구름에 모인 만큼 비가 많이 (요청)

    // 구름의 물이 그만큼 줄어든다 (요청): 게이지를 비운다.
    localStorage.setItem(rainedKey(),String(sec));
    var bf=document.querySelector('.bcloud-label .bfill');if(bf)bf.style.width='0%';
    // 옆면 기둥이 '올라오는' 게 아니라 물통 '속' 물이 차오른다 (요청):
    // 기둥은 잠깐 사라졌다 페이드로 복귀, 수면(plane)이 바닥에서 상승.
    var wp=document.getElementById('waterPlane');
    tub.querySelectorAll('.water').forEach(function(wt){wt.style.transition='opacity .25s';wt.style.opacity='0';});
    if(wp){wp.style.transition='none';
      wp.style.transform='translateY('+(TUB.H/2-TUB.wood*TUB.H)+'px) rotateX(90deg)';}
    void tub.offsetHeight;
    setTimeout(function(){
      if(wp)wp.style.transition='transform 1.6s cubic-bezier(.4,0,.2,1)';
      updateWater();},350);
    setTimeout(function(){
      cl.remove();drops.forEach(function(d){d.remove();});

      if(wp)wp.style.transition='transform .8s cubic-bezier(.4,0,.2,1)';

  // 앱 하늘색을 시간대로 재현 (요청: 할일 등 배경을 앱과 동일하게).
  function hx(v){return '#'+('000000'+v.toString(16)).slice(-6);}
  function lerpHex(a,b,t){var ar=a>>16,ag=(a>>8)&255,ab=a&255,br=b>>16,bg=(b>>8)&255,bb=b&255;
    return hx(((ar+(br-ar)*t)|0)<<16|((ag+(bg-ag)*t)|0)<<8|((ab+(bb-ab)*t)|0));}
  function applySky(){
    var h=new Date().getHours()+new Date().getMinutes()/60;
    // [시각, top, bottom]
    var K=[[0,0x1E2A57,0x45406E],[5,0x2F3E77,0xB4657F],[6.5,0x7FA8D2,0xFFD79A],
           [9,0x2E86D8,0xAFDBF2],[16,0x2E86D8,0xAFDBF2],[18,0x5E7FB4,0xFF9E8C],
           [19.5,0x2F3E77,0xB4657F],[21,0x1E2A57,0x45406E],[24,0x1E2A57,0x45406E]];
    var i=0;while(i<K.length-1&&h>K[i+1][0])i++;
    var a=K[i],b=K[Math.min(i+1,K.length-1)],t=(h-a[0])/Math.max(0.001,b[0]-a[0]);
    var top=lerpHex(a[1],b[1],t),bot=lerpHex(a[2],b[2],t);
    var r=document.documentElement.style;r.setProperty('--sky-top',top);r.setProperty('--sky-bot',bot);
  }

  function setCapDetail(d){cap.detail=(cap.detail===d?'options':d);paintCap();}
  function submitCapture(){
    var title=(document.getElementById('capText').value||'').trim();
    if(!title)return;
    var o={title:title,categoryID:cap.draft.categoryID,colorKey:cap.draft.colorKey,iconName:cap.draft.iconName,
      durationMin:cap.draft.durationMin,scheduledStart:cap.draft.scheduledStart,
      reminderOffsets:cap.draft.reminderOffsets,nudgeEnabled:cap.draft.nudgeEnabled,
      dueDate:cap.draft.dueDate,notes:cap.draft.notes,repeatDaysMask:cap.draft.repeatDaysMask};
    if(cap.origin==='matrix')o.matrixQuadrant=cap.quadrant;
    if(cap.origin==='timeline'&&!o.scheduledStart){
      var slot=nextSlotToday(),base=selDate();base.setHours(Math.floor(slot),Math.round((slot%1)*60),0,0);
      o.scheduledStart=base.toISOString();if(!o.durationMin)o.durationMin=50;
    }
    if(cap.draft.rewardIsMoney){o.rewardMoney=parseInt((cap.draft.rewardText||'').replace(/[^0-9]/g,''),10)||0;}
    else if(cap.draft.rewardText){o.rewardText=cap.draft.rewardText;o.rewardToQ4=cap.draft.rewardToQ4;}
    addTask(o);
    closeCapture();renderAll();pushSnapshot();
  }
  function capDurLabel(m){return m<=0?'실시간':(m<60?m+'분':(m%60===0?(m/60)+'시간':(Math.floor(m/60)+'시간 '+(m%60)+'분')));}

  function paintCap(){

    ib.onclick=function(){cap.iconOpen=!cap.iconOpen;paintCap();};
    document.getElementById('capSubmit').onclick=submitCapture;
    document.getElementById('capText').oninput=function(){
      document.getElementById('capSubmit').disabled=!this.value.trim();

    ipw.innerHTML=cap.iconOpen?renderIconPanel():'';
    // 색 피커

        '<button class="cap-opt'+(cap.draft.scheduledStart?' on':'')+'" data-d="schedule">'+IC.schedule+'<b>시간배치</b></button>'+

        '<button class="cap-opt'+((cap.draft.rewardIsMoney||cap.draft.rewardText)?' on':'')+'" data-d="reward">'+IC.gift+'<b>보상</b></button>'+
        '</div>';
      d.querySelectorAll('.cap-opt').forEach(function(b){b.addEventListener('click',function(){setCapDetail(b.dataset.d);});});
    } else if(cap.detail==='duration'){
      d.innerHTML=renderDurationPanel();

      d.innerHTML=renderSchedulePanel();

      wireRepeatPanel();
    } else if(cap.detail==='reward'){
      d.innerHTML=renderRewardPanel();
      wireRewardPanel();

  function findIconSvg(key){
    for(var c in CAP_ICONS){var hit=CAP_ICONS[c].find(function(p){return p[0]===key;});if(hit)return svgI(hit[1]);}
    return IC.none;
  }
  function renderIconPanel(){
    var html='<div class="icon-panel"><button class="icon-none" id="iconNoneBtn">'+IC.none+' 아이콘 없음</button>';
    CAP_CAT_ORDER.forEach(function(cid){
      html+='<div class="icg-h">'+esc(CATS[cid].name)+'</div><div class="icg-grid">';
      CAP_ICONS[cid].forEach(function(p){
        html+='<button data-i="'+p[0]+'" data-c="'+cid+'" style="color:'+CATS[cid].color+'">'+svgI(p[1])+'</button>';
      });
      html+='</div>';
    });
    html+='</div>';
    return html;
  }
  function renderColorRow(){
    return '<div class="color-row">'+CAP_COLORS.map(function(c){

    }).join('')+'</div>';

  });

  function wireSchedulePanel(){
    document.querySelectorAll('#capDetail [data-s]').forEach(function(b){
      b.addEventListener('click',function(){
        var v=b.dataset.s,now=new Date(),d;
        if(v==='now')d=now;

        else if(v==='eve'){d=new Date();d.setHours(19,0,0,0);}
        else if(v==='am'){d=new Date();d.setDate(d.getDate()+1);d.setHours(9,0,0,0);}
        else if(v==='clear'){cap.draft.scheduledStart=null;paintCap();return;}
        cap.draft.scheduledStart=d.toISOString();paintCap();

    var y=cap.calMonth.getFullYear(),m=cap.calMonth.getMonth();

  }
  function wireDuePanel(){
    document.getElementById('capCalPrev').addEventListener('click',function(){cap.calMonth.setMonth(cap.calMonth.getMonth()-1);paintCap();});
    document.getElementById('capCalNext').addEventListener('click',function(){cap.calMonth.setMonth(cap.calMonth.getMonth()+1);paintCap();});
    document.querySelectorAll('#capDetail .cd[data-d]').forEach(function(el){
      el.addEventListener('click',function(){
        var y=cap.calMonth.getFullYear(),m=cap.calMonth.getMonth();
        cap.draft.dueDate=new Date(y,m,+el.dataset.d).toISOString();paintCap();
      });
    });
    document.querySelectorAll('#capDetail [data-q]').forEach(function(b){
      b.addEventListener('click',function(){
        var q=b.dataset.q;
        if(q==='clear'){cap.draft.dueDate=null;}
        else{var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+ +q);cap.draft.dueDate=d.toISOString();cap.calMonth=new Date(d);}
        paintCap();
      });
    });
    document.getElementById('capDueDone').addEventListener('click',function(){setCapDetail('options');});
  }

  // 메모 패널: 서식 버튼이 커서/선택 영역에 마크다운을 적용한다 (요청: 앱 메모 파리티).
  function renderNotePanel(){
    return '<div class="cap-panel cap-note"><div style="display:flex;gap:8px;align-items:flex-start">'+
      '<textarea id="capNoteArea" placeholder="메모…">'+esc(cap.draft.notes)+'</textarea>'+
      '<div style="display:flex;flex-direction:column;gap:6px"><button class="cap-done" id="capNoteDone" style="margin:0">완료</button>'+
      '<button class="cap-chip" id="capNoteCancel">취소</button></div></div>'+
      '<div class="cap-fmtrow">'+
      ['bold','italic','bullet','numbered','indent','outdent','link'].map(function(k){return '<button class="cap-fmt" data-f="'+k+'">'+IC[k]+'</button>';}).join('')+
      '</div></div>';
  }
  function mdWrap(ta,before,after){
    var s=ta.selectionStart,e=ta.selectionEnd,v=ta.value,sel=v.slice(s,e)||'';
    var nv=v.slice(0,s)+before+sel+after+v.slice(e);
    ta.value=nv;ta.focus();ta.selectionStart=s+before.length;ta.selectionEnd=s+before.length+sel.length;
  }
  function mdLinePrefix(ta,prefix){
    var s=ta.selectionStart,v=ta.value;
    var lineStart=v.lastIndexOf('\n',s-1)+1;
    ta.value=v.slice(0,lineStart)+prefix+v.slice(lineStart);
    ta.focus();ta.selectionStart=ta.selectionEnd=s+prefix.length;
  }
  function wireNotePanel(){
    var ta=document.getElementById('capNoteArea');
    document.querySelectorAll('#capDetail [data-f]').forEach(function(b){
      b.addEventListener('click',function(){
        var f=b.dataset.f;
        if(f==='bold')mdWrap(ta,'**','**');
        else if(f==='italic')mdWrap(ta,'*','*');
        else if(f==='bullet')mdLinePrefix(ta,'- ');
        else if(f==='numbered')mdLinePrefix(ta,'1. ');
        else if(f==='indent')mdLinePrefix(ta,'\t');
        else if(f==='outdent'){var v=ta.value,s=ta.selectionStart,ls=v.lastIndexOf('\n',s-1)+1;
          if(v[ls]==='\t'){ta.value=v.slice(0,ls)+v.slice(ls+1);ta.selectionStart=ta.selectionEnd=Math.max(ls,s-1);}}
        else if(f==='link'){var url=prompt('링크 주소');if(url)mdWrap(ta,'[',']('+url+')');}
        cap.draft.notes=ta.value;
      });
    });
    ta.addEventListener('input',function(){cap.draft.notes=ta.value;});
    document.getElementById('capNoteDone').addEventListener('click',function(){cap.draft.notes=ta.value;setCapDetail('options');});
    document.getElementById('capNoteCancel').addEventListener('click',function(){setCapDetail('options');});
  }

  function renderRepeatPanel(){
    var lb=['일','월','화','수','목','금','토'];
    return '<div class="cap-panel"><div class="cap-days">'+
      lb.map(function(l,i){return '<button class="cap-day'+((cap.draft.repeatDaysMask&(1<<i))?' on':'')+'" data-wd="'+i+'">'+l+'</button>';}).join('')+
      '</div><div class="cap-row" style="margin-top:8px"><button class="cap-done" id="capRepDone">완료</button></div></div>';
  }
  function wireRepeatPanel(){
    document.querySelectorAll('#capDetail .cap-day').forEach(function(b){
      b.addEventListener('click',function(){
        var wd=+b.dataset.wd;cap.draft.repeatDaysMask^=(1<<wd);paintCap();
      });
    });
    document.getElementById('capRepDone').addEventListener('click',function(){setCapDetail('options');});
  }

  function renderRewardPanel(){
    if(!cap.notePlaceholderShown){cap.rewardPh=REWARD_EXAMPLES[Math.floor(Math.random()*REWARD_EXAMPLES.length)];cap.notePlaceholderShown=true;}
    var isMoney=cap.draft.rewardIsMoney;
    return '<div class="cap-panel"><div class="cap-row">'+
      '<button class="cap-chip'+(isMoney?' on':'')+'" id="capRewMoney">₩ 돈</button>'+
      '<input id="capRewText" placeholder="'+(isMoney?'금액 (숫자만)':esc(cap.rewardPh))+'" value="'+esc(cap.draft.rewardText)+'" '+
        'style="flex:1;min-width:120px;border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-family:inherit">'+
      (isMoney?'':'<button class="cap-chip'+(cap.draft.rewardToQ4?' on':'')+'" id="capRewQ4">Q4 추가</button>')+
      '<button class="cap-done" id="capRewDone">완료</button></div></div>';
  }
  function wireRewardPanel(){
    document.getElementById('capRewMoney').addEventListener('click',function(){
      cap.draft.rewardIsMoney=!cap.draft.rewardIsMoney;
      if(cap.draft.rewardIsMoney)cap.draft.rewardText=cap.draft.rewardText.replace(/[^0-9]/g,'');
      paintCap();
    });
    var inp=document.getElementById('capRewText');
    inp.addEventListener('input',function(){
      if(cap.draft.rewardIsMoney){var d=this.value.replace(/[^0-9]/g,'');if(d!==this.value)this.value=d;}
      cap.draft.rewardText=this.value;
    });
    var q4=document.getElementById('capRewQ4');if(q4)q4.addEventListener('click',function(){cap.draft.rewardToQ4=!cap.draft.rewardToQ4;paintCap();});
    document.getElementById('capRewDone').addEventListener('click',function(){setCapDetail('options');});
  }

  document.getElementById('capWrap').addEventListener('click',function(e){if(e.target===this)closeCapture();});

  /* ---------- boot ---------- */
  updateAcct();setTab('todo');renderAll();if(session)fetchSnapshot();
})();
</script>
</body>
</html>
